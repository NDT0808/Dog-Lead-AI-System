<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 Thư Viện Ảnh Thẩm Định Thú Cưng - Pet Leads Visual Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .header {
      max-width: 1400px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(16, 185, 129, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .guide-badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Search & Stats */
    .toolbar {
      max-width: 1400px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 480px;
    }
    .search-box input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px 10px 38px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .stats-summary {
      display: flex;
      gap: 12px;
    }
    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .stat-pill span { color: var(--emerald); font-weight: 800; }

    /* Gallery Grid */
    .gallery-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--emerald);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), 0 0 15px rgba(16, 185, 129, 0.18);
    }
    .card-top-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }
    .circle-avatar-box {
      width: 58px;
      height: 58px;
      min-width: 58px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      border: 2px solid var(--emerald);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
      background: #0f172a;
      flex-shrink: 0;
    }
    .circle-avatar-box:hover {
      transform: scale(1.12);
      border-color: #34d399;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.55);
    }
    .circle-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      image-rendering: -webkit-optimize-contrast;
      display: block;
    }
    .lead-info-wrap {
      flex: 1;
      overflow: hidden;
    }
    .card-title {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 3px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s ease;
    }
    .card:hover .card-title {
      color: #60a5fa;
    }
    .card-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dog-verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
      min-height: 24px;
    }
    .tag {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      color: #c7d2fe;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-open-fb {
      flex: 1;
      background: #1877f2;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s;
    }
    .btn-open-fb:hover {
      background: #166fe5;
      transform: translateY(-1px);
    }
    .btn-copy-id {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-copy-id:hover {
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <h1><span>🐾</span> Thư Viện Ảnh Thẩm Định Thú Cưng (Pet Leads Visual Gallery)</h1>
      <p>Nhận diện hồ sơ cún & trại chó qua mô hình AI ONNX (dog-model.onnx) • Ảnh tròn sắc nét 100%</p>
    </div>
    <div class="guide-badge">
      <span>💡</span> NHẤP VÀO ẢNH HOẶC NÚT ĐỂ MỞ TRANG FACEBOOK CÁ NHÂN
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm kiếm theo Tên, FB_ID, Giống chó..." />
    </div>
    <div class="stats-summary">
      <div class="stat-pill">Tổng mục tiêu chó: <span id="txtTotal">0</span></div>
    </div>
  </div>

  <div class="gallery-grid" id="galleryContainer"></div>

  <script>
    const leads = [{"fb_id": "100063922191947", "name": "Good Dog Official", "url": "https://www.facebook.com/officialgooddog", "avatar_url": "https://unavatar.io/facebook/100063922191947?fallback=https%3A%2F%2Fui-avatars.com%2Fapi%2F%3Fname%3DGood%20Dog", "subtitle": "Breeds, Puppies, Ethical breeders and kennel community", "is_target_dog": true, "detection_method": "Từ khóa: dog, puppies, kennel", "ai_vision_result": "none (P=0.00)", "confidence": 0.85, "matched_keywords": ["dog", "puppies", "kennel", "breeders"], "local_photos": [], "scraped_at": "2026-10-19 02:31:34"}, {"fb_id": "100064633721746", "name": "Home for Good Dog Rescue", "url": "https://www.facebook.com/HomeForGoodDogRescue", "avatar_url": "https://unavatar.io/facebook/100064633721746?fallback=https%3A%2F%2Fui-avatars.com%2Fapi%2F%3Fname%3DRescue", "subtitle": "Rescue dogs, pet adoption and puppy fostering", "is_target_dog": true, "detection_method": "Từ khóa: dog, dogs, puppy", "ai_vision_result": "none (P=0.00)", "confidence": 0.85, "matched_keywords": ["dog", "dogs", "puppy"], "local_photos": [], "scraped_at": "2026-10-19 02:31:41"}, {"fb_id": "100081804938692", "name": "Redhill Boykin Spaniels", "url": "https://www.facebook.com/RedhillBoykinSpaniels", "avatar_url": "https://unavatar.io/facebook/100081804938692?fallback=https%3A%2F%2Fui-avatars.com%2Fapi%2F%3Fname%3DRedhill", "subtitle": "Boykin Spaniel hunting retriever kennel", "is_target_dog": true, "detection_method": "Từ khóa: kennel, retriever, spaniel", "ai_vision_result": "none (P=0.00)", "confidence": 0.85, "matched_keywords": ["kennel", "retriever", "spaniel", "boykin spaniel"], "local_photos": [], "scraped_at": "2026-10-19 02:31:41"}];

    function renderGallery(items) {
      const container = document.getElementById('galleryContainer');
      document.getElementById('txtTotal').textContent = items.length;

      if (items.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)">Không tìm thấy hồ sơ nào khớp với tìm kiếm.</div>';
        return;
      }

      container.innerHTML = items.map((item) => {
        const primaryImg = (item.avatar_url && item.avatar_url.startsWith('http')) 
          ? item.avatar_url 
          : 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150';

        const kwStr = (item.matched_keywords || []).slice(0, 3).map(k => `<span class="tag">🐾 ${k}</span>`).join('');
        const idDisplay = item.fb_id ? `ID: ${item.fb_id}` : 'Facebook Profile';

        return `
          <div class="card" onclick="window.open('${item.url}', '_blank')">
            <div>
              <div class="card-top-row">
                <!-- Ảnh tròn nhỏ sắc nét, nhấp vào mở trang cá nhân Facebook -->
                <div class="circle-avatar-box" onclick="event.stopPropagation(); window.open('${item.url}', '_blank');" title="Nhấp vào ảnh để mở Facebook cá nhân">
                  <img src="${primaryImg}" class="circle-avatar-img" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=150';" loading="lazy" />
                </div>
                <div class="lead-info-wrap">
                  <div class="card-title" title="${item.name || 'Người dùng Facebook'}">${item.name || 'Người dùng Facebook'}</div>
                  <div class="card-sub">${item.subtitle || idDisplay}</div>
                  <div class="dog-verified-badge">🐶 Mục Tiêu Chó</div>
                </div>
              </div>
              <div class="meta-tags">
                ${kwStr || '<span class="tag">🐾 Thẩm định AI</span>'}
              </div>
            </div>
            <div class="card-footer">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-open-fb" onclick="event.stopPropagation();" title="Mở trang Facebook cá nhân">
                <span>🔗</span> Mở Facebook
              </a>
              <button class="btn-copy-id" onclick="event.stopPropagation(); navigator.clipboard.writeText('${item.fb_id || item.url}'); alert('Đã sao chép FB ID!');" title="Sao chép ID/Link">
                📋 ID
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Realtime search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderGallery(leads);
        return;
      }
      const filtered = leads.filter(i => 
        (i.name && i.name.toLowerCase().includes(q)) ||
        (i.fb_id && i.fb_id.includes(q)) ||
        (i.subtitle && i.subtitle.toLowerCase().includes(q)) ||
        (i.matched_keywords && i.matched_keywords.some(k => k.toLowerCase().includes(q)))
      );
      renderGallery(filtered);
    });

    // Initial render
    renderGallery(leads);
  </script>
</body>
</html>
