<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Model Local Tester</title>
    <script src="ort.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; color: #e2e8f0; 
            padding: 20px; 
            margin: 0;
        }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        
        .panel {
            background: #1e293b; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 800px; margin: 0 auto 20px;
        }
        
        .controls { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        
        button {
            padding: 10px 20px; background: #38bdf8; border: none; border-radius: 8px;
            color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #7dd3fc; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        
        input[type="file"] {
            padding: 10px; background: #334155; border-radius: 8px;
        }

        #video-wrapper {
            position: relative; display: flex; justify-content: center;
            background: #000; border-radius: 12px; overflow: hidden;
            border: 2px solid #334155;
            margin: 0 auto;
            max-width: fit-content;
        }
        
        video { 
            max-height: 70vh; 
            max-width: 100%;
        }
        
        .bbox {
            position: absolute; border: 3px solid #10b981; pointer-events: none;
            box-sizing: border-box; display: none; z-index: 10;
        }
        
        .bbox-label {
            position: absolute; top: -25px; left: -3px; background: #10b981; color: white;
            padding: 2px 6px; font-size: 14px; font-weight: bold; white-space: nowrap;
        }
    </style>
</head>
<body>
    <h2>🐶 Môi Trường Test Local - Nhận Diện Chó (YOLOv8)</h2>
    
    <div class="panel">
        <div class="controls">
            <input type="file" id="video-upload" accept="video/*">
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <label>Ngưỡng (Threshold):</label>
                <input type="range" id="threshold" min="0" max="1" step="0.05" value="0.5">
                <span id="threshold-val" style="font-weight:bold; color: #38bdf8;">50%</span>
            </div>
            
            <button id="start-btn" disabled>⏳ Đang nạp Model...</button>
        </div>
        
        <p style="font-size: 14px; color: #94a3b8;">
            * Hướng dẫn: Chọn 1 video từ máy tính của bạn (định dạng mp4) -> Bấm "Bắt đầu quét" để xem AI vẽ khung nhận diện theo thời gian thực (Real-time).
        </p>
    </div>
    
    <div id="video-wrapper">
        <video id="test-video" controls loop></video>
        <div id="bbox" class="bbox">
            <div id="bbox-label" class="bbox-label">CHÓ (99%)</div>
        </div>
    </div>

    <script>
        const IMG_SIZE = 640;
        let model = null;
        let isTesting = false;
        const video = document.getElementById('test-video');
        const bbox = document.getElementById('bbox');
        const bboxLabel = document.getElementById('bbox-label');
        const thresholdInput = document.getElementById('threshold');
        const startBtn = document.getElementById('start-btn');

        thresholdInput.addEventListener('input', (e) => {
            document.getElementById('threshold-val').innerText = Math.round(e.target.value * 100) + '%';
        });

        document.getElementById('video-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                video.src = url;
                video.play();
            }
        });

        async function loadModel() {
            try {
                // Đảm bảo trỏ đúng thư mục để lấy các file .wasm
                ort.env.wasm.wasmPaths = './';
                model = await ort.InferenceSession.create('dog-model.onnx', { executionProviders: ['wasm'] });
                startBtn.innerText = '▶️ Bắt đầu Quét Real-time';
                startBtn.disabled = false;
            } catch (e) {
                alert("Lỗi nạp model ONNX: " + e.message + "\nLưu ý: Mở file này trên server local (Live Server) thay vì double click trực tiếp nếu bị lỗi CORS.");
            }
        }

        startBtn.addEventListener('click', () => {
            isTesting = !isTesting;
            startBtn.innerText = isTesting ? '⏸️ Dừng Quét' : '▶️ Bắt đầu Quét Real-time';
            startBtn.style.background = isTesting ? '#ef4444' : '#38bdf8';
            if (isTesting) {
                requestAnimationFrame(scanLoop);
            } else {
                bbox.style.display = 'none';
            }
        });

        async function scanLoop() {
            if (!isTesting) return;
            await scanFrame();
            // Lặp lại liên tục, quét khoảng 5-10 khung hình/giây
            setTimeout(() => requestAnimationFrame(scanLoop), 150); 
        }

        async function scanFrame() {
            if (!video.videoWidth || video.paused || video.ended) {
                bbox.style.display = 'none';
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = IMG_SIZE;
            canvas.height = IMG_SIZE;
            const ctx = canvas.getContext('2d');
            
            // Background đen
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);

            const vW = video.videoWidth;
            const vH = video.videoHeight;
            const scale = Math.min(IMG_SIZE / vW, IMG_SIZE / vH);
            const w = vW * scale;
            const h = vH * scale;
            const padX = (IMG_SIZE - w) / 2;
            const padY = (IMG_SIZE - h) / 2;

            ctx.drawImage(video, 0, 0, vW, vH, padX, padY, w, h);
            const imgData = ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;

            const floatData = new Float32Array(3 * IMG_SIZE * IMG_SIZE);
            for (let i = 0; i < IMG_SIZE * IMG_SIZE; i++) {
                floatData[i] = imgData[i * 4] / 255.0;
                floatData[IMG_SIZE * IMG_SIZE + i] = imgData[i * 4 + 1] / 255.0;
                floatData[2 * IMG_SIZE * IMG_SIZE + i] = imgData[i * 4 + 2] / 255.0;
            }

            const tensor = new ort.Tensor('float32', floatData, [1, 3, IMG_SIZE, IMG_SIZE]);
            const results = await model.run({ images: tensor });
            const output = results[Object.keys(results)[0]].data;

            let maxConf = 0;
            let bestClass = -1;
            let bestBox = null;
            let anchors = 8400; // YOLOv8 640x640 mặc định
            
            for (let i = 0; i < anchors; i++) {
                let class0 = output[4 * anchors + i];
                let class1 = output[5 * anchors + i];
                let class2 = output[6 * anchors + i];
                
                let currentMax = Math.max(class0, class1, class2);
                
                if (currentMax > maxConf) {
                    maxConf = currentMax;
                    if (currentMax === class0) bestClass = 0;
                    else if (currentMax === class1) bestClass = 1;
                    else bestClass = 2;
                    
                    bestBox = {
                        xc: output[0 * anchors + i],
                        yc: output[1 * anchors + i],
                        w: output[2 * anchors + i],
                        h: output[3 * anchors + i]
                    };
                }
            }

            let threshold = parseFloat(thresholdInput.value);
            
            // Vẽ Bounding Box
            if (maxConf > threshold && bestBox) {
                let origXc = (bestBox.xc - padX) / scale;
                let origYc = (bestBox.yc - padY) / scale;
                let origW = bestBox.w / scale;
                let origH = bestBox.h / scale;

                const rect = video.getBoundingClientRect();
                const renderScaleX = rect.width / vW;
                const renderScaleY = rect.height / vH;

                let displayW = origW * renderScaleX;
                let displayH = origH * renderScaleY;
                let displayLeft = (origXc * renderScaleX) - displayW / 2;
                let displayTop = (origYc * renderScaleY) - displayH / 2;

                bbox.style.left = displayLeft + 'px';
                bbox.style.top = displayTop + 'px';
                bbox.style.width = displayW + 'px';
                bbox.style.height = displayH + 'px';
                bbox.style.display = 'block';

                let labelName = "RÁC (NON-DOG)";
                if (bestClass === 0) labelName = "CHÓ LỚN";
                if (bestClass === 2) labelName = "CHÓ CON";
                
                let isRác = (bestClass === 1);
                bbox.style.borderColor = isRác ? '#ef4444' : '#10b981';
                bboxLabel.style.background = isRác ? '#ef4444' : '#10b981';
                bboxLabel.innerText = \`\${labelName} (\${Math.round(maxConf * 100)}%)\`;
            } else {
                bbox.style.display = 'none';
            }
        }

        // Bắt đầu tải model
        loadModel();
    </script>
</body>
</html>
