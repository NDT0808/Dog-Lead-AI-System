<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet & Grass 潜客智能 CRM - 美国本土市场专案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #e4e9f2;
      --border-strong: #cfd8e6;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --sky: #0284c7;
      --sky-soft: #f0f9ff;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --slate-soft: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 10px 28px -14px rgba(15, 23, 42, .18);
      --shadow-lg: 0 8px 40px -12px rgba(15, 23, 42, .22);
      --radius: 16px;
      --font: 'Inter', 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(1100px 520px at 8% -6%, #e8edff 0%, transparent 60%),
        radial-gradient(900px 460px at 100% 0%, #e6fbf4 0%, transparent 58%),
        radial-gradient(800px 460px at 50% 110%, #fff4e6 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding: 1.5rem 1.25rem 3.5rem;
    }

    .container {
      max-width: 1560px;
      margin: 0 auto
    }

    code {
      font-family: var(--mono);
      font-size: .82em;
      background: var(--surface-3);
      border: 1px solid var(--border);
      padding: .1em .4em;
      border-radius: 6px;
      color: var(--primary)
    }

    a {
      color: var(--primary)
    }

    /* ---------- 通用组件 ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-2);
      padding: .5rem .95rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: .16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--border-strong);
      transform: translateY(-1px)
    }

    .btn:active {
      transform: none
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .55)
    }

    .btn-primary:hover {
      background: #4338ca;
      border-color: #4338ca;
      color: #fff
    }

    .btn-sky {
      background: var(--sky);
      border-color: var(--sky);
      color: #fff
    }

    .btn-sky:hover {
      background: #0369a1;
      border-color: #0369a1;
      color: #fff
    }

    .btn-sm {
      padding: .32rem .7rem;
      font-size: .78rem;
      border-radius: 8px
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .22rem .6rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      line-height: 1.5;
      white-space: nowrap
    }

    .badge-s {
      background: var(--amber-soft);
      color: #b45309;
      border: 1px solid #fde68a
    }

    .badge-a {
      background: var(--primary-soft);
      color: #4338ca;
      border: 1px solid #c7d2fe
    }

    .badge-b {
      background: var(--emerald-soft);
      color: #047857;
      border: 1px solid #a7f3d0
    }

    .badge-c {
      background: var(--slate-soft);
      color: #475569;
      border: 1px solid var(--border-strong)
    }

    .badge-d {
      background: var(--rose-soft);
      color: #be123c;
      border: 1px solid #fecdd3
    }

    /* ---------- 顶部 ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 1.6rem 1.75rem;
      margin-bottom: 1.1rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #c7d2fe;
      padding: .3rem .8rem;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
    }

    h1 {
      font-size: 1.72rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: .6rem 0 .5rem;
      line-height: 1.3
    }

    .header-desc {
      color: var(--text-2);
      font-size: .9rem;
      max-width: 900px
    }

    .batch-badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      flex-wrap: wrap;
      margin-top: .7rem;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: .35rem .7rem;
      font-size: .78rem;
      color: var(--text-2);
      font-weight: 600;
    }

    .batch-badge.imported {
      background: var(--emerald-soft);
      border-color: #a7f3d0;
      color: #047857
    }

    .batch-badge .b-name {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--text)
    }

    .batch-badge .b-time {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--primary)
    }

    .batch-badge.imported .b-time {
      color: #047857
    }

    .batch-badge .b-sep {
      color: var(--text-3)
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .7rem
    }

    .lang-switcher {
      display: inline-flex;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: .34rem .8rem;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      font-family: var(--font);
      transition: .16s
    }

    .lang-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm)
    }

    .data-strip {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
      background: linear-gradient(90deg, #ecfdf5, #f0f9ff);
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: .6rem .9rem;
      margin-bottom: 1.1rem;
      font-size: .8rem;
      color: #0369a1;
      font-weight: 600;
    }

    .data-strip code {
      background: rgba(255, 255, 255, .85);
      border-color: #bae6fd;
      color: #0369a1
    }

    /* ---------- 气象雷达 ---------- */
    .radar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.1rem
    }

    .radar-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.1rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed var(--border)
    }

    .radar-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .radar-desc-text {
      font-size: .83rem;
      color: var(--text-2);
      max-width: 760px;
      margin-top: .25rem
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 0 rgba(5, 150, 105, .5);
      animation: pulse 2s infinite
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, .5)
      }

      70% {
        box-shadow: 0 0 0 9px rgba(5, 150, 105, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0)
      }
    }

    .radar-status {
      font-size: .76rem;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: .25rem .6rem;
      border-radius: 999px
    }

    .radar-status.fallback {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: #fde68a
    }

    .radar-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
      gap: .9rem
    }

    .radar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: .95rem 1rem;
      transition: .18s
    }

    .radar-card:hover {
      border-color: #c7d2fe;
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .radar-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .78rem;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: .35rem
    }

    .radar-live {
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: .1rem .42rem;
      border-radius: 5px
    }

    .radar-live.off {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: #fde68a
    }

    .radar-city {
      font-size: .78rem;
      color: var(--text-3);
      font-family: var(--mono)
    }

    .radar-weather-display {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: .6rem 0 .7rem
    }

    .radar-temp {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -.03em;
      font-family: var(--mono);
      color: var(--text)
    }

    .radar-w-desc {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-2)
    }

    .radar-w-sub {
      font-size: .7rem;
      color: var(--text-3);
      font-family: var(--mono)
    }

    .radar-trigger-pill {
      font-size: .72rem;
      font-weight: 600;
      line-height: 1.5;
      color: #4338ca;
      background: var(--primary-soft);
      border: 1px solid #c7d2fe;
      border-radius: 9px;
      padding: .45rem .6rem
    }

    /* ---------- 评分说明 ---------- */
    .alert-box {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 1.15rem 1.35rem;
      margin-bottom: 1.1rem;
      box-shadow: var(--shadow-sm)
    }

    .alert-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-weight: 800;
      font-size: .98rem;
      color: #92400e;
      margin-bottom: .55rem
    }

    .alert-content {
      font-size: .84rem;
      color: #78350f;
      line-height: 1.75
    }

    .formula-pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: .78rem;
      background: #fff;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: .3rem .7rem;
      border-radius: 8px;
      margin: .35rem 0
    }

    /* ---------- KPI ---------- */
    .section-title {
      font-size: 1.02rem;
      font-weight: 800;
      margin: 1.6rem 0 .8rem;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 17px;
      border-radius: 3px;
      background: var(--primary)
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow-sm);
      transition: .18s;
      position: relative;
      overflow: hidden
    }

    .kpi-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .kpi-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent, var(--primary))
    }

    .kpi-card.c1 {
      --accent: var(--primary)
    }

    .kpi-card.c2 {
      --accent: var(--amber)
    }

    .kpi-card.c3 {
      --accent: var(--emerald)
    }

    .kpi-card.c4 {
      --accent: var(--violet)
    }

    .kpi-card.c5 {
      --accent: var(--sky)
    }

    .kpi-label {
      font-size: .76rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .kpi-value {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -.03em;
      font-family: var(--mono);
      color: var(--accent, var(--primary));
      line-height: 1.25;
      margin: .15rem 0
    }

    .kpi-sub {
      font-size: .77rem;
      color: var(--text-2);
      line-height: 1.5
    }

    /* ---------- 图表 ---------- */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.15rem 1.15rem;
      box-shadow: var(--shadow-sm)
    }

    .chart-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .7rem
    }

    .chart-container {
      position: relative;
      height: 250px
    }

    .chart-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: .8rem;
      color: var(--text-3);
      text-align: center;
      padding: 1rem;
      background: var(--surface-2);
      border-radius: 10px
    }

    /* ---------- 表格 ---------- */
    .table-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.1rem
    }

    .table-toolbar {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: .8rem
    }

    .filter-group {
      display: flex;
      gap: .55rem;
      flex-wrap: wrap;
      align-items: center
    }

    .search-box,
    .select-filter {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      border-radius: 9px;
      padding: .5rem .75rem;
      font-size: .82rem;
      font-family: var(--font);
      color: var(--text);
      transition: .16s;
    }

    .search-box {
      flex: 1 1 300px;
      min-width: 240px
    }

    .search-box:focus,
    .select-filter:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .13)
    }

    .select-filter {
      cursor: pointer;
      max-width: 230px
    }

    .toolbar-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap
    }

    .result-count {
      font-size: .82rem;
      color: var(--text-2)
    }

    .result-count b {
      color: var(--primary);
      font-family: var(--mono)
    }

    .table-responsive {
      overflow-x: auto;
      max-height: 74vh;
      overflow-y: auto
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: .83rem
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-3);
      color: var(--text-2);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-align: left;
      padding: .7rem .8rem;
      border-bottom: 1px solid var(--border-strong);
      white-space: nowrap;
    }

    thead th.sortable {
      cursor: pointer;
      user-select: none
    }

    thead th.sortable:hover {
      color: var(--primary);
      background: #e9eefb
    }

    thead th .sort-ind {
      opacity: .35;
      font-size: .7rem;
      margin-left: .2rem
    }

    thead th.sorted .sort-ind {
      opacity: 1;
      color: var(--primary)
    }

    tbody td {
      padding: .7rem .8rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-2)
    }

    tbody tr:nth-child(even) {
      background: #fbfcfe
    }

    tbody tr:hover {
      background: var(--primary-soft)
    }

    .cell-code {
      font-family: var(--mono);
      font-size: .74rem;
      color: var(--text-3);
      white-space: nowrap
    }

    .fb-id {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-family: var(--mono);
      font-size: .74rem;
      font-weight: 600;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 7px;
      padding: .15rem .45rem;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none
    }

    .fb-id:hover {
      background: #dbeafe;
      border-color: #93c5fd
    }

    .fb-id.none {
      color: var(--text-3);
      background: var(--slate-soft);
      border-color: var(--border);
      cursor: default
    }

    .fb-id.none:hover {
      background: var(--slate-soft);
      border-color: var(--border)
    }

    .lead-name {
      font-weight: 700;
      font-size: .86rem;
      color: var(--text);
      line-height: 1.45
    }

    .lead-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700
    }

    .lead-link:hover {
      text-decoration: underline
    }

    .lead-owner {
      font-size: .75rem;
      color: var(--text-2);
      margin-top: .2rem
    }

    .lead-owner b {
      color: var(--sky)
    }

    .lead-contact {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-top: .35rem
    }

    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      font-size: .72rem;
      font-family: var(--mono);
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: .12rem .45rem;
      color: var(--text-2);
      text-decoration: none
    }

    .contact-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft)
    }

    .loc-text {
      font-size: .8rem;
      color: var(--text-2);
      white-space: nowrap
    }

    .cat-text {
      font-size: .78rem;
      color: var(--text-2);
      max-width: 190px
    }

    .prod-text {
      font-size: .78rem;
      color: var(--text-2);
      max-width: 210px
    }

    .action-text {
      font-size: .75rem;
      color: var(--text-2);
      max-width: 230px
    }

    .score-pill {
      display: inline-block;
      font-family: var(--mono);
      font-weight: 800;
      font-size: .82rem;
      padding: .2rem .55rem;

     *  数据加载：优先 fetch 真实 JSON（便于外部调用与热更新）
     *  file:// 直开时 fetch 被浏览器拦截，自动回退到 data/loader.js（由 tools/build.mjs 生成）
     * ========================================================================= */
    const DATA_FILES = ['meta', 'analytics', 'i18n', 'leads'];

    async function loadData() {
      try {
        const responses = await Promise.all(DATA_FILES.map(f => fetch(`data/${f}.json`, { cache: 'no-cache' })));
        if (responses.some(r => !r.ok)) throw new Error('json fetch failed');
        const [meta, analytics, i18n, leads] = await Promise.all(responses.map(r => r.json()));
        return { meta, analytics, i18n, leads, via: 'fetch' };
      } catch (err) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'data/loader.js';
          s.onload = resolve;
          s.onerror = () => reject(new Error('loader.js not found'));
          document.head.appendChild(s);
        });
        return { ...window.REPORT_DATA, via: 'loader' };
      }
    }

      return String(tpl == null ? '' : tpl).replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : `{${k}}`));

    const num = (n) => (typeof n === 'number' ? n.toLocaleString('en-US') : n);
    const pad2 = (n) => String(n).padStart(2, '0');
    /** 2026-10-16 15:32:07 */
    const fmtDateTime = (d, dateOnly) => {
      const x = d instanceof Date ? d : new Date(d);
      if (isNaN(x.getTime())) return '—';
      const day = `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
      return dateOnly ? day : `${day} ${pad2(x.getHours())}:${pad2(x.getMinutes())}:${pad2(x.getSeconds())}`;
    };
    /** 20261016_1532 —— 用于导出文件名 */
    const stampOf = (d) => {

    /* ============================ 天气引擎 ============================ */
    function locKeyOf(lead) {
      return lead.zip ? String(lead.zip) : `${lead.city || ''}_${lead.state || ''}`;
    }

    function offlineWeather(lead) {
      const rules = S.meta.weatherRules;
      const st = (lead.state || '').trim().toUpperCase();
      let type = 'mild';
      if (rules.cold.states.includes(st)) type = 'cold';
      else if (rules.rain.states.includes(st)) type = 'rain';
      else if (rules.hot.states.includes(st)) type = 'hot';
      const fb = rules[type].fallback;
      return {
        tempF: fb.tempF, tempC: Math.round((fb.tempF - 32) * 5 / 9),
        main: fb.main, desc: fb.desc, icon: fb.icon,
        humidity: 55, wind: 6, conditionType: type, cityName: lead.city || lead.state || 'USA', isLive: false
      };
    }

    async function fetchWeather(lead) {
      const key = locKeyOf(lead);
      if (!key || key === '_') return null;
      if (S.weatherCache[key]) return S.weatherCache[key];

      const cfg = S.meta.config;
      let url = '';
      if (lead.zip) url = `${cfg.owmEndpoint}?zip=${lead.zip},US&units=${cfg.owmUnits}&appid=${cfg.owmApiKey}`;
      else if (lead.city && lead.state) url = `${cfg.owmEndpoint}?q=${encodeURIComponent(lead.city)},${lead.state},US&units=${cfg.owmUnits}&appid=${cfg.owmApiKey}`;
      if (!url) return null;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('owm failed');
        const d = await res.json();
        const tempF = Math.round(d.main.temp);
        const main = d.weather[0].main;
        let type = 'mild';
        const th = S.meta.weatherRules.thresholds;
        if (tempF < th.coldBelowF || main === 'Snow') type = 'cold';
        else if (['Rain', 'Drizzle', 'Thunderstorm'].includes(main)) type = 'rain';
        else if (tempF > th.hotAboveF) type = 'hot';
        S.weatherCache[key] = {
          tempF, tempC: Math.round((tempF - 32) * 5 / 9), main,
          desc: d.weather[0].description, icon: d.weather[0].icon,
          humidity: d.main.humidity, wind: d.wind.speed, conditionType: type,
          cityName: d.name || lead.city || lead.state, isLive: true
        };
      } catch (e) {
        S.weatherCache[key] = offlineWeather(lead);
      }
      return S.weatherCache[key];
    }

    function weatherOf(lead) {
      const key = locKeyOf(lead);
      return (key && key !== '_' && S.weatherCache[key]) || null;
    }

    function triggerOf(lead, w) {
      const cond = w ? w.conditionType : 'mild';
      const temp = w ? `${w.tempF}°F (${w.tempC}°C) · ` : '';
      return {
        icon: { cold: '❄️', rain: '🌧️', hot: '☀️', mild: '🌤️' }[cond],
        cls: `w-${cond}`,
        label: temp + t(cond),
        pitch: t('pitch' + cond.charAt(0).toUpperCase() + cond.slice(1))
      };
    }

    /* ============================ 表格 ============================ */
    function amzKindOf(l) {
      const c = l.amz_cat || '';
      if (c.includes('Selling pet toys + Artificial grass')) return 'both_target';
      if (c.includes('Selling artificial grass')) return 'grass_target';
      if (c.includes('Selling pet toys')) return 'toys_target';
      if (!l.amz_link || c === 'Amazon link not found') return 'no_amz';
      return 'amz_other';
    }

    function tierCls(tier) {
      return { 'Tier S': 's', 'Tier A': 'a', 'Tier B': 'b', 'Tier C': 'c', 'Tier D': 'd' }[tier] || 'c';
    }

    function applyFilters() {
      const q = ($('searchInput').value || '').toLowerCase().trim();
      const amzVal = $('amzFilter').value;
      const tierVal = $('tierFilter').value;
      const catVal = $('catFilter').value;
      const wVal = $('weatherFilter').value;
      const avVal = $('avatarFilter') ? $('avatarFilter').value : '';
      const rules = S.meta.weatherRules;

      S.filtered = S.leads.filter(l => {
        if (q) {
          const hay = [l.name, l.owner, l.phone, l.email, l.city, l.state, l.zip, l.cat, l.product_fit, l.stt, l.fb_id]
            .filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (tierVal && l.rank_tier !== tierVal) return false;
        if (catVal && l.cat_code !== catVal) return false;
        if (avVal && l.avatar_type !== avVal) return false;
        if (amzVal) {
          const k = amzKindOf(l);
          if (amzVal === 'has_amz' ? k === 'no_amz' : k !== amzVal) return false;
        }
        if (wVal) {
          const st = (l.state || '').trim().toUpperCase();
          if (wVal === 'cold') { if (!rules.cold.states.includes(st)) return false; }
          else if (wVal === 'rain') { if (!rules.rain.states.includes(st)) return false; }
          else if (wVal === 'hot') { if (!rules.hot.states.includes(st)) return false; }
          else if (wVal === 'mild') {
            if ([...rules.cold.states, ...rules.rain.states, ...rules.hot.states].includes(st)) return false;
          }
        }
        return true;
      });

      const { key, dir } = S.sort;
      const sign = dir === 'asc' ? 1 : -1;
      S.filtered.sort((a, b) => {
        let x = a[key], y = b[key];
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * sign;
        x = String(x == null ? '' : x); y = String(y == null ? '' : y);
        return x.localeCompare(y, 'en') * sign;
      });
    }

    function tierOfScore(s) { return s >= 85 ? 'Tier S' : s >= 70 ? 'Tier A' : s >= 50 ? 'Tier B' : s >= 30 ? 'Tier C' : 'Tier D'; }

    function codeOfCat(l) {
      if (l.cat_code) return l.cat_code;
      const c = String(l.cat || '').toLowerCase();
      if (c.includes('rescue') || c.includes('shelter')) return 'rescue';
      if (c.includes('training') || c.includes('grooming') || c.includes('care') || c.includes('k9')) return 'service';
      return 'breeder';
    }

    /**
     * 从 url 中提取 Facebook 主页 ID：
     *   profile.php?id=100068499867139  -> 100068499867139
     *   /466919830365897/               -> 466919830365897
     *   /pages/Name/153319254699055/    -> 153319254699055
     *   /Sierra-Springs-...-194814241052484/ -> 194814241052484
     *   /lkbernedoodles/                -> lkbernedoodles（自定义用户名）
     * 多个链接用 ; 分隔时取第一个 facebook 链接；非 FB 链接返回空。
     */
    function fbIdOf(lead) {
      if (lead.fb_id) return String(lead.fb_id);
      const raw = String(lead.url || '');
      const parts = raw.split(/[;,\s]+/).filter(Boolean);
      const fb = parts.find(u => /facebook\.com/i.test(u));
      if (!fb) return '';
      try {
        const u = new URL(/^https?:/i.test(fb) ? fb : 'https://' + fb);
        if (!/(^|\.)facebook\.com$/i.test(u.hostname)) return '';
        const id = u.searchParams.get('id');
        if (id && /^\d{5,}$/.test(id)) return id;
        const seg = u.pathname.split('/').filter(Boolean);
        if (!seg.length) return '';
        if (seg[0] === 'pages') {
          const nums = seg.filter(s => /^\d{5,}$/.test(s));
          if (nums.length) return nums[nums.length - 1];
        }
        const last = seg[seg.length - 1];
        if (/^\d{5,}$/.test(last)) return last;
        const m = last.match(/-(\d{8,})$/);
        if (m) return m[1];
        return last.replace(/\?.*$/, '');
      } catch (e) { return ''; }
    }

    /** 接受数组，或 { leads: [...] } 包装；补齐缺失字段并派生评级/分类编码 */
    function normalizeLeads(raw) {
      const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.leads) ? raw.leads : null);
      if (!arr) throw new Error('shape');
      if (!arr.length) throw new Error('empty');
      if (!arr[0] || typeof arr[0] !== 'object' || Array.isArray(arr[0])) throw new Error('shape');
      return arr.map((l, i) => {
        const o = {};
        LEAD_FIELDS.forEach(k => { o[k] = (l && l[k] != null) ? l[k] : ''; });
        o.score = Number(o.score) || 0;
        if (!o.rank_tier) o.rank_tier = tierOfScore(o.score);
        if (!o.cat_code) o.cat_code = codeOfCat(o);
        if (!o.country) o.country = 'United States';
        if (!o.stt) o.stt = 'LEAD-' + String(i + 1).padStart(6, '0');
        if (!o.name) o.name = o.stt;
        o.is_prio = !!o.is_prio || o.rank_tier === 'Tier S';
        o.fb_id = fbIdOf(o);
        return o;
      });
    }

    /** 前端版统计引擎，与 tools/build.mjs 口径一致；导入后自动重算 */
    function computeAnalytics(leads) {
      const pct = (n) => leads.length ? +((n / leads.length) * 100).toFixed(1) : 0;
      const tally = (fn) => {
        const m = new Map();
        for (const r of leads) { const k = fn(r); if (k == null || k === '') continue; m.set(k, (m.get(k) || 0) + 1); }
        return [...m.entries()].sort((a, b) => b[1] - a[1]);
      };
      const order = ['Tier S', 'Tier A', 'Tier B', 'Tier C', 'Tier D'];
      const tiersRaw = tally((l) => l.rank_tier).sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
      const tiers = tiersRaw.map(([label, value]) => ({ label, value, percent: pct(value) }));

      const AMZ = {
        both_target: { zh: '玩具 + 草坪便盆（双目标）', vi: 'Cả đồ chơi + Cỏ/Potty (TARGET kép)' },
        grass_target: { zh: '草坪 / 便盆 TARGET', vi: 'Cỏ / Khay Potty (TARGET)' },
        toys_target: { zh: '玩具 TARGET', vi: 'Đồ chơi (TARGET)' },
        amz_other: { zh: '亚马逊其他品类', vi: 'Amazon khác' },
        no_amz: { zh: '暂无亚马逊店铺', vi: 'Chưa có Amazon' }
      };
      const amzRaw = tally(amzKindOf);
      const amazon = amzRaw.map(([key, value]) => ({ key, value, percent: pct(value), zh: AMZ[key].zh, vi: AMZ[key].vi }));
      const amazonIndex = Object.fromEntries(amzRaw);

      const CAT = {
        breeder: { zh: '商业繁育犬舍 (Breeder)', vi: 'Trại chó thương mại (Breeder)' },
        service: { zh: '训犬 / 美容 / 寄宿 (Pet Care)', vi: 'Huấn luyện & Boarding' },
        rescue: { zh: '动物救助站 (Rescue)', vi: 'Trạm cứu trợ / Shelter' }
      };
      const categories = tally((l) => l.cat_code).map(([key, value]) =>
        ({ key, value, percent: pct(value), zh: (CAT[key] || { zh: key }).zh, vi: (CAT[key] || { vi: key }).vi }));

      const scores = leads.map((l) => Number(l.score) || 0);
      const buckets = [
        { label: '85 - 100', min: 85, max: 100 }, { label: '70 - 84', min: 70, max: 84 },
        { label: '50 - 69', min: 50, max: 69 }, { label: '30 - 49', min: 30, max: 49 },
        { label: '< 30', min: -Infinity, max: 29 }
      ].map(b => ({ label: b.label, value: scores.filter(s => s >= b.min && s <= b.max).length }));

      const has = (k) => leads.filter((l) => typeof l[k] === 'string' && l[k].trim() !== '').length;
      const contactCoverage = [
        { key: 'phone', zh: '电话 Phone', vi: 'Điện thoại Phone', value: has('phone') },
        { key: 'email', zh: '邮箱 Email', vi: 'Email', value: has('email') },
        { key: 'website', zh: '官网 Website', vi: 'Website chính thức', value: has('website') },
        { key: 'url', zh: 'Facebook 主页', vi: 'Trang Facebook', value: has('url') },
        { key: 'zip', zh: '邮编 Zip', vi: 'Mã Zip', value: has('zip') }
      ].map(d => ({ ...d, percent: pct(d.value) }));

      const geoStates = tally((l) => String(l.state || '').trim().toUpperCase());
      const reachable = leads.filter((l) => l.phone || l.email).length;

      return {
        generatedAt: new Date().toISOString(),
        totalLeads: leads.length,
        score: {
          min: scores.length ? Math.min(...scores) : 0,
          max: scores.length ? Math.max(...scores) : 0,
          avg: scores.length ? +(scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0,
          buckets
        },
        tiers,
        tierIndex: Object.fromEntries(tiers.map(d => [d.label, d.value])),
        amazon,
        amazonIndex,
        amazonTotal: (amazonIndex.both_target || 0) + (amazonIndex.grass_target || 0) + (amazonIndex.toys_target || 0) + (amazonIndex.amz_other || 0),
        categories,
        contactCoverage,
        geo: { states: geoStates.slice(0, 12).map(([label, value]) => ({ label: label || '未标注', value })), distinctStates: geoStates.filter(([s]) => s).length },
        dataQuality: {
          reachableByPhoneOrEmail: reachable,
          reachablePercent: pct(reachable),
          missingState: leads.filter((l) => !String(l.state || '').trim()).length
        },
        priorityLeads: leads.filter((l) => l.is_prio).length
      };
    }

    function applyImported(leads, name) {
      S.leads = leads;
      S.filtered = [...leads];
      S.page = 1;
      S.sort = { key: 'score', dir: 'desc' };
      Object.keys(S.weatherCache).forEach(k => delete S.weatherCache[k]);
      S.an = computeAnalytics(leads);
      const now = new Date();
      S.source = { type: 'imported', name, count: leads.length, at: now, atLabel: fmtDateTime(now) };
      renderShell();
      applyI18n();
      renderRadarHubs();
      updateRadarStatus();
      renderCharts();
      renderTable();
      toast(fmt(t('importSuccess'), { name, count: num(leads.length) }), 'ok');
    }

    function importError(err) {
      const m = err && err.message;
      const msg = m === 'shape' ? t('importInvalid') : m === 'empty' ? t('importEmpty') : (m || String(err));
      toast(fmt(t('importFail'), { msg }), 'error');
    }

    async function importFileObject(file) {
      if (!file) return;
      try {
        const text = await file.text();
        applyImported(normalizeLeads(JSON.parse(text)), file.name);
      } catch (err) { importError(err); }
    }

    function triggerImport() { const el = $('importFile'); if (el) el.click(); }

    async function handleImportFile(ev) {
      const input = ev.target;
      const file = input.files && input.files[0];
      if (file) await importFileObject(file);
      input.value = '';
    }

    function bindDropZone() {
      const zone = $('dataStrip');
      if (!zone) return;
      const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
      ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { stop(e); zone.classList.add('dragover'); }));
      zone.addEventListener('dragleave', e => { stop(e); zone.classList.remove('dragover'); });
      zone.addEventListener('drop', e => {
        stop(e);
        zone.classList.remove('dragover');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) importFileObject(f);
      });
    }

    /* ============================ 导出 ============================ */
    function exportSalesData() {
      const headers = isVi()
        ? ['STT / Mã', 'FB ID', 'Tên đối tác', 'Chủ sở hữu / Đại diện', 'Điện thoại', 'Email', 'Website', 'Facebook URL',
          'Thành phố', 'Bang', 'Zip', 'Quốc gia', 'Loại hình', 'Kênh Amazon', 'Link Amazon', 'Sản phẩm gợi ý',
          'Điểm', 'Hạng', 'Thời tiết & kịch bản', 'Hành động Sales']
        : ['序号', 'FB ID', '客户名称', '所有者/业务代表', '联系电话', '商务邮箱', '官方网站', 'Facebook 主页',
          '城市', '州', '邮编', '国家', '业务分类', '亚马逊渠道', '亚马逊链接', '推荐匹配产品',
          '综合评分', '客户评级', '实时天气与营销触发', '销售动作建议'];

      const rows = S.filtered.map(l => {
        const w = weatherOf(l);
        const trg = triggerOf(l, w);
        const weatherStr = w ? `${trg.icon} ${trg.label}: ${trg.pitch}` : '';
        return [l.stt, l.fb_id || '', l.name || '', l.owner || '', l.phone || '', l.email || '', l.website || '', l.url || '',
        l.city || '', l.state || '', l.zip || '', l.country || 'United States', l.cat || '',
        l.amz_cat || '', l.amz_link || '', l.product_fit || '', l.score, l.rank_tier, weatherStr, l.sales_action || ''];
      });

      const src = currentSource();
      const prefix = (isVi() ? 'Danh_Sach_Khach_Hang_Sales_Pet_Grass' : '美国狗舍潜客销售联络表')
        + '_' + safeName(src.name) + '_' + stampOf(src.at);

      if (typeof XLSX !== 'undefined') {
        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        ws['!cols'] = [16, 22, 32, 25, 18, 28, 30, 26, 16, 10, 12, 15, 26, 26, 30, 28, 10, 12, 52, 40].map(wch => ({ wch }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, isVi() ? 'Khach_Hang_Sales' : '潜客销售列表');
        XLSX.writeFile(wb, `${prefix}.xlsx`);
      } else {
        const csv = '\uFEFF' + [headers, ...rows]
          .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = `${prefix}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
    }

    /* ============================ 启动 ============================ */
    (async function init() {
      try {
        S.data = await loadData();
      } catch (err) {
        $('app').innerHTML = `<div class="loading-wrap">
      <div class="load-error">
        <b>${isVi() ? 'Không thể tải dữ liệu' : '无法加载数据'}</b><br>
        data/leads.json、data/analytics.json、data/meta.json、data/i18n.json 或 data/loader.js 缺失。<br>
        ${isVi() ? 'Hãy chạy:' : '请在项目根目录执行：'} <code>node tools/build.mjs</code>
      </div></div>`;
        return;
      }
      S.meta = S.data.meta;
      S.i18n = S.data.i18n;
      const builtinDay = (S.meta.report && S.meta.report.generatedAt) || fmtDateTime(new Date(), true);
      S.leads = normalizeLeads(S.data.leads);
      S.source = { type: 'builtin', name: 'data/leads.json', at: new Date(builtinDay), atLabel: builtinDay };
      S.an = computeAnalytics(S.leads);
      S.pageSize = (S.meta && S.meta.config && S.meta.config.pageSize) || 25;
      S.filtered = [...S.leads];

      // 阻止把文件拖到页面空白处时浏览器直接打开（会丢失当前状态）
      ['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => {
        const el = e.target;
        if (el && el.closest && el.closest('#dataStrip')) return;
        e.preventDefault();
      }));

      renderShell();
      applyI18n();
      renderRadarHubs();
      updateRadarStatus();
      renderCharts();
      renderTable();
    })();
  </script>
</body>
