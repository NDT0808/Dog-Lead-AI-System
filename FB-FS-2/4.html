    async function updateSnovBatchModalKpis() {
      const history = await loadSnovHistory();
      const seenEmails = new Set(Object.keys(history.exported_emails || {}));
      const seenFbids = new Set(Object.keys(history.exported_fbids || {}));

      const allLeads = S.leads || [];
      const total = allLeads.length;

      let withEmailCount = 0;
      let excludedCount = 0;
      let readyCount = 0;

      allLeads.forEach(l => {
        const em = String(l.email || '').trim().toLowerCase();
        const fb = String(l.fb_id || '').trim();
        if (em && em.includes('@') && em.includes('.')) {
          withEmailCount++;
          if (seenEmails.has(em) || (fb && seenFbids.has(fb))) {
            excludedCount++;
          } else {
            readyCount++;
          }
        }
      });

      if ($('snovKpiTotal')) $('snovKpiTotal').textContent = num(total);
      if ($('snovKpiWithEmail')) $('snovKpiWithEmail').textContent = num(withEmailCount);
      if ($('snovKpiExcluded')) $('snovKpiExcluded').textContent = num(excludedCount);
      if ($('snovKpiReady')) $('snovKpiReady').textContent = num(readyCount);
    }

    function extractCleanFirstName(owner, name) {
      if (!owner || owner === 'Chủ trại' || owner === 'Facebook User' || owner === 'Manager') {
        if (name && !/(kennel|pup|frenchie|farm|breeder|doodles|shepherds)/i.test(name)) {
          const p = name.trim().split(/\s+/);
          if (p.length > 0) return p[0].charAt(0).toUpperCase() + p[0].slice(1);
        }
        return 'Manager';
      }
      let clean = owner.replace(/\(.*?\)/g, '');
      if (clean.includes('|')) clean = clean.split('|')[0];
      const parts = clean.trim().split(/\s+/);
      if (parts.length > 0 && parts[0]) {
        return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
      }
      return 'Manager';
    }

    async function startSnovBatchExport() {
      const history = await loadSnovHistory();
      const seenEmails = new Set(Object.keys(history.exported_emails || {}));
      const seenFbids = new Set(Object.keys(history.exported_fbids || {}));

      // Xác định số lượng xuất
      let targetCount = 500;
      const opt = document.querySelector('input[name="snovCountOpt"]:checked')?.value || '500';
      if (opt === 'custom') {
        targetCount = parseInt($('snovCustomCountInput')?.value || '40', 10);
      } else {
        targetCount = parseInt(opt, 10);
      }
      if (isNaN(targetCount) || targetCount < 1) targetCount = 20;

      const downloadType = document.querySelector('input[name="snovDownloadType"]:checked')?.value || 'zip';

      // Tuyển chọn các leads thỏa mãn: Có Email, Chưa từng gửi
      const candidates = [];
      const currentEmails = new Set();
      const currentFbids = new Set();

      // Sắp xếp ưu tiên: Điểm cao -> Tier S -> Có SĐT
      const sorted = [...(S.leads || [])].sort((a, b) => {
        const sA = (a.rank_tier === 'Tier S' ? 200 : (a.rank_tier === 'Tier A' ? 100 : 0)) + (Number(a.score) || 0) + (a.phone ? 10 : 0);
        const sB = (b.rank_tier === 'Tier S' ? 200 : (b.rank_tier === 'Tier A' ? 100 : 0)) + (Number(b.score) || 0) + (b.phone ? 10 : 0);
        return sB - sA;
      });

      for (const l of sorted) {
        const em = String(l.email || '').trim().toLowerCase();
        const fb = String(l.fb_id || '').trim();

        if (!em || !em.includes('@') || !em.includes('.')) continue;
        if (['example.com', 'none', 'null', 'test@'].some(x => em.includes(x))) continue;
        if (seenEmails.has(em) || currentEmails.has(em)) continue;
        if (fb && (seenFbids.has(fb) || currentFbids.has(fb))) continue;

        currentEmails.add(em);
        if (fb) currentFbids.add(fb);
        candidates.push(l);

        if (candidates.length >= targetCount) break;
      }

      if (candidates.length === 0) {
        toast(isVi() ? '❌ Không còn khách hàng mới có Email chưa từng gửi trong Database!' : '❌ 数据库中暂无新的未发送邮箱客户！', 'error');
        return;
      }

      // Khởi tạo tiến trình UI
      const progWrap = $('snovProgressWrap');
      const progBar = $('snovProgressBar');
      const progLbl = $('snovProgressLabel');
      const progPct = $('snovProgressPercent');
      const btnExec = $('btnExecuteSnovExport');

      if (progWrap) progWrap.style.display = 'block';
      if (btnExec) btnExec.disabled = true;

      const batchSize = 20;
      const totalParts = Math.ceil(candidates.length / batchSize);
      const todayStr = fmtDateTime(new Date(), true);

      const headers = [
        '邮箱地址', '名字', '全名', '用户社交', '工作职位',
        '国家', '地址', '行业', '添加日期', '公司名称',
        '公司网址', '公司社交', '公司所处国家', '公司位置',
        '州', '城市', '公司所在行业', '电话', 'remark', 'fb_id'
      ];

      let zip = null;
      if (downloadType === 'zip' && typeof JSZip !== 'undefined') {
        zip = new JSZip();
      }

      for (let pIdx = 0; pIdx < totalParts; pIdx++) {
        const partNum = pIdx + 1;
        const partLeads = candidates.slice(pIdx * batchSize, (pIdx + 1) * batchSize);
        const fileName = `Top_Leads_${todayStr}_Part_${String(partNum).padStart(2, '0')}_of_${String(totalParts).padStart(2, '0')}.xlsx`;

        // Cập nhật thanh tiến trình
        const percent = Math.round((partNum / totalParts) * 90);
        if (progBar) progBar.style.width = `${percent}%`;
        if (progPct) progPct.textContent = `${percent}%`;
        if (progLbl) progLbl.textContent = isVi() ? `⏳ Đang đóng gói ${fileName} (${partLeads.length} khách)...` : `⏳ 正在打包 ${fileName}...`;
        await new Promise(r => setTimeout(r, 20));

        const rows = partLeads.map(lead => {
          const rawOwner = lead.owner || 'Chủ trại';
          const bizName = lead.name || 'Trại cún';
          const firstName = extractCleanFirstName(rawOwner, bizName);
          const emailVal = String(lead.email || '').trim().toLowerCase();
          const fbIdVal = String(lead.fb_id || '').trim();
          const phoneVal = lead.phone || '';
          const webVal = lead.website || '';
          const urlVal = lead.url || (fbIdVal ? `https://www.facebook.com/profile.php?id=${fbIdVal}` : '');
          const cityVal = lead.city || '';
          const stateVal = lead.state || '';
          const locVal = [cityVal, stateVal].filter(Boolean).join(', ');
          let remarkVal = lead.sales_action || `Score ${lead.score || 80} | ${lead.rank_tier || 'Tier A'}`;
          if (lead.has_amazon || lead.amazon_url) remarkVal += ' | Có Amazon Storefront';

          // Ghi nhận vào lịch sử
          history.exported_emails[emailVal] = fileName;
          if (fbIdVal) history.exported_fbids[fbIdVal] = fileName;

          return [
            emailVal,
            firstName,
            (rawOwner && rawOwner !== 'Chủ trại') ? rawOwner : bizName,
            urlVal,
            '创始人兼繁育人 (Breeder & Owner)',
            lead.country || 'United States',
            stateVal,
            '宠物繁育 / 狗舍 (Dog Breeder)',
            todayStr,
            bizName,
            webVal,
            urlVal,
            'United States',
            locVal,
            stateVal,
            cityVal,
            '宠物繁育 / 狗舍 (Dog Breeder)',
            phoneVal,
            remarkVal,
            fbIdVal
          ];
        });

        if (typeof XLSX !== 'undefined') {
          const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
          ws['!cols'] = [28, 14, 24, 35, 25, 15, 10, 24, 12, 30, 30, 35, 15, 24, 10, 16, 24, 18, 35, 18].map(wch => ({ wch }));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

          if (zip) {
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            zip.file(fileName, wbout);
          } else {
            XLSX.writeFile(wb, fileName);
            await new Promise(r => setTimeout(r, 120));
          }
        }
      }

      // Xử lý nén ZIP nếu chọn tải trọn gói
      if (zip) {
        if (progLbl) progLbl.textContent = isVi() ? '📦 Đang nén toàn bộ các file thành tệp ZIP...' : '📦 正在压缩为 ZIP 文件...';
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const zipName = `Snov_Leads_Batch_${todayStr}_${candidates.length}_Leads_${totalParts}_Files.zip`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = zipName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // Lưu lịch sử vào localStorage
      try {
        localStorage.setItem('snov_export_history', JSON.stringify(history));
      } catch (_) {}

      // Tự động đẩy lịch sử lên Server để máy chủ ghi nhớ vĩnh viễn
      try {
        const currentHost = (window.location.protocol.startsWith('http')) ? `${window.location.protocol}//${window.location.host}` : '';
        const targetUrl = currentHost ? `${currentHost}/api.php?route=save-data-file` : 'http://43.156.237.143:3007/api.php?route=save-data-file';
        await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: 'snov_export_history.json', content: history })
        });
      } catch (_) {}

      // Hoàn tất
      if (progBar) progBar.style.width = '100%';
      if (progPct) progPct.textContent = '100%';
      if (progLbl) progLbl.textContent = isVi() ? '🎉 Đã xuất thành công!' : '🎉 导出成功！';
      if (btnExec) btnExec.disabled = false;

      await updateSnovBatchModalKpis();

      const successMsg = isVi()
        ? `🎉 [XUẤT SNOV.IO THÀNH CÔNG] Đã xuất ${candidates.length} khách hàng thành ${totalParts} file Excel (20 khách/file), 100% không trùng lặp và đã cập nhật lịch sử!`
        : `🎉 [导出成功] 已成功导出 ${candidates.length} 条客户，分为 ${totalParts} 个文件 (20条/文件)，100%无重复并已更新历史数据库！`;
      toast(successMsg, 'ok');

      setTimeout(() => {
        closeSnovBatchExportModal();
      }, 1500);
    }

      S.source = { type: 'builtin', name: 'data/leads.json', at: new Date(builtinDay), atLabel: builtinDay };
      S.an = computeAnalytics(S.leads);
      S.pageSize = (S.meta && S.meta.config && S.meta.config.pageSize) || 25;
      S.filtered = [...S.leads];

      // 阻止把文件拖到页面空白处时浏览器直接打开（会丢失当前状态）
      ['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => {
        const el = e.target;
        if (el && el.closest && el.closest('#dataStrip')) return;
        e.preventDefault();
      }));

      renderShell();
      applyI18n();
      renderRadarHubs();
      updateRadarStatus();
      renderCharts();
      renderTable();
    })();
  </script>
</body>

</html>
