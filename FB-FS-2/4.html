<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet & Grass 潜客智能 CRM - 美国本土市场专案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #e4e9f2;
      --border-strong: #cfd8e6;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --sky: #0284c7;
      --sky-soft: #f0f9ff;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --slate-soft: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
      --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 10px 28px -14px rgba(15, 23, 42, .18);
      --shadow-lg: 0 8px 40px -12px rgba(15, 23, 42, .22);
      --radius: 16px;
      --font: 'Inter', 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(1100px 520px at 8% -6%, #e8edff 0%, transparent 60%),
        radial-gradient(900px 460px at 100% 0%, #e6fbf4 0%, transparent 58%),
        radial-gradient(800px 460px at 50% 110%, #fff4e6 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding: 1.5rem 1.25rem 3.5rem;
    }

    .container {
      max-width: 1880px;
      width: 98%;
      margin: 0 auto;
      transition: max-width 0.25s ease, padding 0.25s ease;
    }

    .container.is-fullwidth {
      max-width: 100% !important;
      width: 100% !important;
      padding-left: 0.75rem !important;
      padding-right: 0.75rem !important;
    }

    code {
      font-family: var(--mono);
      font-size: .82em;
      background: var(--surface-3);
      border: 1px solid var(--border);
      padding: .1em .4em;
      border-radius: 6px;
      color: var(--primary)
    }

    a {
      color: var(--primary)
    }

    /* ---------- 通用组件 ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-2);
      padding: .5rem .95rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: .16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface-3);
      color: var(--text);
      border-color: var(--border-strong);
      transform: translateY(-1px)
    }

    .btn:active {
      transform: none
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .55)
    }

    .btn-primary:hover {
      background: #4338ca;
      border-color: #4338ca;
      color: #fff
    }

    .btn-sky {
      background: var(--sky);
      border-color: var(--sky);
      color: #fff
    }

    .btn-sky:hover {
      background: #0369a1;
      border-color: #0369a1;
      color: #fff
    }

    .btn-sm {
      padding: .32rem .7rem;
      font-size: .78rem;
      border-radius: 8px
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .22rem .6rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      line-height: 1.5;
      white-space: nowrap
    }

    .badge-s {
      background: var(--amber-soft);
      color: #b45309;
      border: 1px solid #fde68a
    }

    .badge-a {
      background: var(--primary-soft);
      color: #4338ca;
      border: 1px solid #c7d2fe
    }

    .badge-b {
      background: var(--emerald-soft);
      color: #047857;
      border: 1px solid #a7f3d0
    }

    .badge-c {
      background: var(--slate-soft);
      color: #475569;
      border: 1px solid var(--border-strong)
    }

    .badge-d {
      background: var(--rose-soft);
      color: #be123c;
      border: 1px solid #fecdd3
    }

    /* ---------- 顶部 ---------- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 1.6rem 1.75rem;
      margin-bottom: 1.1rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid #c7d2fe;
      padding: .3rem .8rem;
      border-radius: 999px;
      font-size: .78rem;
      font-weight: 700;
    }

    h1 {
      font-size: 1.72rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: .6rem 0 .5rem;
      line-height: 1.3
    }

    .header-desc {
      color: var(--text-2);
      font-size: .9rem;
      max-width: 900px
    }

    .batch-badge {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      flex-wrap: wrap;
      margin-top: .7rem;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: .35rem .7rem;
      font-size: .78rem;
      color: var(--text-2);
      font-weight: 600;
    }

    .batch-badge.imported {
      background: var(--emerald-soft);
      border-color: #a7f3d0;
      color: #047857
    }

    .batch-badge .b-name {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--text)
    }

    .batch-badge .b-time {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--primary)
    }

    .batch-badge.imported .b-time {
      color: #047857
    }

    .batch-badge .b-sep {
      color: var(--text-3)
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .7rem
    }

    .lang-switcher {
      display: inline-flex;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: .34rem .8rem;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      font-family: var(--font);
      transition: .16s
    }

    .lang-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm)
    }

    .data-strip {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
      background: linear-gradient(90deg, #ecfdf5, #f0f9ff);
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: .6rem .9rem;
      margin-bottom: 1.1rem;
      font-size: .8rem;
      color: #0369a1;
      font-weight: 600;
    }

    .data-strip code {
      background: rgba(255, 255, 255, .85);
      border-color: #bae6fd;
      color: #0369a1
    }

    /* ---------- 气象雷达 ---------- */
    .radar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.35rem 1.5rem;
      margin-bottom: 1.1rem
    }

    .radar-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.1rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed var(--border)
    }

    .radar-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .radar-desc-text {
      font-size: .83rem;
      color: var(--text-2);
      max-width: 760px;
      margin-top: .25rem
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 0 rgba(5, 150, 105, .5);
      animation: pulse 2s infinite
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, .5)
      }

      70% {
        box-shadow: 0 0 0 9px rgba(5, 150, 105, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0)
      }
    }

    .radar-status {
      font-size: .76rem;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: .25rem .6rem;
      border-radius: 999px
    }

    .radar-status.fallback {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: #fde68a
    }

    .radar-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
      gap: .9rem
    }

    .radar-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: .95rem 1rem;
      transition: .18s
    }

    .radar-card:hover {
      border-color: #c7d2fe;
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .radar-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .78rem;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: .35rem
    }

    .radar-live {
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .06em;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: .1rem .42rem;
      border-radius: 5px
    }

    .radar-live.off {
      color: var(--amber);
      background: var(--amber-soft);
      border-color: #fde68a
    }

    .radar-city {
      font-size: .78rem;
      color: var(--text-3);
      font-family: var(--mono)
    }

    .radar-weather-display {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: .6rem 0 .7rem
    }

    .radar-temp {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -.03em;
      font-family: var(--mono);
      color: var(--text)
    }

    .radar-w-desc {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-2)
    }

    .radar-w-sub {
      font-size: .7rem;
      color: var(--text-3);
      font-family: var(--mono)
    }

    .radar-trigger-pill {
      font-size: .72rem;
      font-weight: 600;
      line-height: 1.5;
      color: #4338ca;
      background: var(--primary-soft);
      border: 1px solid #c7d2fe;
      border-radius: 9px;
      padding: .45rem .6rem
    }

    /* ---------- 评分说明 ---------- */
    .alert-box {
      background: linear-gradient(135deg, #fffbeb, #fff7ed);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 1.15rem 1.35rem;
      margin-bottom: 1.1rem;
      box-shadow: var(--shadow-sm)
    }

    .alert-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-weight: 800;
      font-size: .98rem;
      color: #92400e;
      margin-bottom: .55rem
    }

    .alert-content {
      font-size: .84rem;
      color: #78350f;
      line-height: 1.75
    }

    .formula-pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: .78rem;
      background: #fff;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: .3rem .7rem;
      border-radius: 8px;
      margin: .35rem 0
    }

    /* ---------- KPI ---------- */
    .section-title {
      font-size: 1.02rem;
      font-weight: 800;
      margin: 1.6rem 0 .8rem;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 17px;
      border-radius: 3px;
      background: var(--primary)
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.2rem;
      box-shadow: var(--shadow-sm);
      transition: .18s;
      position: relative;
      overflow: hidden
    }

    .kpi-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .kpi-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent, var(--primary))
    }

    .kpi-card.c1 {
      --accent: var(--primary)
    }

    .kpi-card.c2 {
      --accent: var(--amber)
    }

    .kpi-card.c3 {
      --accent: var(--emerald)
    }

    .kpi-card.c4 {
      --accent: var(--violet)
    }

    .kpi-card.c5 {
      --accent: var(--sky)
    }

    .kpi-label {
      font-size: .76rem;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .kpi-value {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -.03em;
      font-family: var(--mono);
      color: var(--accent, var(--primary));
      line-height: 1.25;
      margin: .15rem 0
    }

    .kpi-sub {
      font-size: .77rem;
      color: var(--text-2);
      line-height: 1.5
    }

    /* ---------- 图表 ---------- */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.15rem 1.15rem;
      box-shadow: var(--shadow-sm)
    }

    .chart-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .7rem
    }

    .chart-container {
      position: relative;
      height: 250px
    }

    .chart-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: .8rem;
      color: var(--text-3);
      text-align: center;
      padding: 1rem;
      background: var(--surface-2);
      border-radius: 10px
    }

    /* ---------- 表格 (SALES PRO HIGH-VISIBILITY SUITE) ---------- */
    .table-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .table-toolbar {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      gap: .65rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box,
    .select-filter {
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      border-radius: 10px;
      padding: .6rem .85rem;
      font-size: .88rem;
      font-family: var(--font);
      color: var(--text);
      transition: all .16s ease;
      font-weight: 600;
    }

    .search-box {
      flex: 1 1 320px;
      min-width: 260px;
    }

    .search-box:focus,
    .select-filter:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .18);
    }

    .select-filter {
      cursor: pointer;
      max-width: 240px;
    }

    .toolbar-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .result-count {
      font-size: .92rem;
      font-weight: 600;
      color: var(--text-2);
    }

    .result-count b {
      color: var(--primary);
      font-family: var(--mono);
      font-weight: 800;
      font-size: 1.05rem;
    }

    .table-responsive {
      overflow-x: auto;
      max-height: 80vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 #f8fafc;
    }
    .table-responsive::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .table-responsive::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: .95rem; /* Large, comfortable base font for sales */
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f1f5f9;
      color: #0f172a;
      font-size: .84rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-align: left;
      padding: 1rem 1.15rem;
      border-bottom: 2px solid #cbd5e1;
      white-space: nowrap;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05);
    }

    thead th.sortable {
      cursor: pointer;
      user-select: none;
      transition: background .16s, color .16s;
    }

    thead th.sortable:hover {
      color: var(--primary);
      background: #e2e8f0;
    }

    thead th .sort-ind {
      opacity: .45;
      font-size: .75rem;
      margin-left: .25rem;
    }

    thead th.sorted .sort-ind {
      opacity: 1;
      color: var(--primary);
    }

    tbody td {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: middle;
      color: #0f172a;
      font-size: .92rem;
      line-height: 1.5;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    tbody tr:hover {
      background: #eef2ff !important;
      box-shadow: inset 4px 0 0 #4f46e5;
    }

    .cell-code {
      font-family: var(--mono);
      font-size: .86rem;
      font-weight: 750;
      color: #475569;
      white-space: nowrap;
    }

    .fb-id {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-family: var(--mono);
      font-size: .84rem;
      font-weight: 700;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 8px;
      padding: .28rem .65rem;
      max-width: none;
      white-space: nowrap;
      text-decoration: none;
      transition: all .16s ease;
    }

    .fb-id:hover {
      background: #dbeafe;
      border-color: #60a5fa;
      transform: translateY(-1px);
    }

    .fb-id.none {
      color: var(--text-3);
      background: var(--slate-soft);
      border-color: var(--border);
      cursor: default;
    }

    .lead-name {
      font-weight: 800;
      font-size: 1.05rem;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 5px;
    }

    .lead-link {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 800;
    }

    .lead-link:hover {
      color: #3730a3;
      text-decoration: underline;
    }

    .lead-owner {
      font-size: .88rem;
      color: #334155;
      font-weight: 600;
      margin: .35rem 0 .45rem;
      line-height: 1.45;
    }

    .lead-owner b {
      color: #0284c7;
      font-weight: 800;
    }

    .lead-contact {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-top: .45rem;
    }

    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .86rem;
      font-family: var(--mono);
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: .3rem .7rem;
      color: #0f172a;
      text-decoration: none;
      transition: all .2s ease;
      cursor: pointer;
    }

    .contact-chip:hover {
      border-color: #4f46e5;
      color: #4f46e5;
      background: #eef2ff;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.15);
    }

    .loc-text {
      font-size: .92rem;
      font-weight: 700;
      color: #1e293b;
      min-width: 140px;
      line-height: 1.45;
      display: block;
    }

    .cat-text {
      font-size: .88rem;
      font-weight: 600;
      color: #334155;
      max-width: 250px;
      line-height: 1.5;
    }

    .prod-text {
      font-size: .88rem;
      font-weight: 600;
      color: #0f172a;
      max-width: 320px;
      line-height: 1.5;
    }

    .action-text {
      font-size: .88rem;
      font-weight: 600;
      color: #0f172a;
      max-width: 320px;
      line-height: 1.5;
    }

    .score-pill {
      display: inline-block;
      font-family: var(--mono);
      font-weight: 800;
      font-size: .95rem;
      padding: .3rem .75rem;
      border-radius: 10px;
      border: 1.5px solid;
    }

    .score-pill.s {
      background: var(--amber-soft);
      color: #b45309;
      border-color: #fde68a
    }

    .score-pill.a {
      background: var(--primary-soft);
      color: #4338ca;
      border-color: #c7d2fe
    }

    .score-pill.b {
      background: var(--emerald-soft);
      color: #047857;
      border-color: #a7f3d0
    }

    .score-pill.c {
      background: var(--slate-soft);
      color: #475569;
      border-color: var(--border-strong)
    }

    .score-pill.d {
      background: var(--rose-soft);
      color: #be123c;
      border-color: #fecdd3
    }

    .badge-amz-target {
      background: var(--amber-soft);
      color: #b45309;
      border: 1px solid #fde68a
    }

    .badge-amz-grass {
      background: var(--emerald-soft);
      color: #047857;
      border: 1px solid #a7f3d0
    }

    .badge-amz-toys {
      background: var(--violet-soft);
      color: #6d28d9;
      border: 1px solid #ddd6fe
    }

    .badge-amz-none {
      background: var(--slate-soft);
      color: var(--text-3);
      border: 1px solid var(--border)
    }

    .weather-cell {
      border-radius: 12px;
      padding: .65rem .85rem;
      cursor: pointer;
      transition: .18s;
      border: 1.5px solid;
      min-width: 240px;
      max-width: 340px;
    }

    .weather-cell:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    .w-cold {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8
    }

    .w-rain {
      background: var(--sky-soft);
      border-color: #bae6fd;
      color: #0369a1
    }

    .w-hot {
      background: var(--amber-soft);
      border-color: #fde68a;
      color: #b45309
    }

    .w-mild {
      background: var(--emerald-soft);
      border-color: #a7f3d0;
      color: #047857
    }

    .w-none {
      background: var(--slate-soft);
      border-color: var(--border);
      color: var(--text-3)
    }

    .weather-temp-row {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .78rem;
      font-weight: 800;
      font-family: var(--mono)
    }

    .weather-trigger-text {
      font-size: .7rem;
      font-weight: 500;
      opacity: .9;
      margin-top: .15rem;
      line-height: 1.45
    }

    .empty-row {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-3);
      font-size: .9rem
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .85rem 1.15rem;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      flex-wrap: wrap
    }

    .page-info {
      font-size: .82rem;
      color: var(--text-2)
    }

    .page-info b {
      color: var(--primary);
      font-family: var(--mono)
    }

    .page-nav {
      display: flex;
      gap: .4rem;
      align-items: center
    }

    /* ---------- Playbook ---------- */
    .playbook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .playbook-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow-sm)
    }

    .playbook-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-weight: 800;
      font-size: .92rem;
      margin-bottom: .65rem;
      color: var(--text)
    }

    .playbook-quote {
      font-size: .83rem;
      font-style: italic;
      color: var(--primary);
      background: var(--primary-soft);
      border-left: 3px solid var(--primary);
      padding: .6rem .8rem;
      border-radius: 0 9px 9px 0;
      margin-bottom: .65rem;
      line-height: 1.6
    }

    .playbook-card p,
    .playbook-card ul {
      font-size: .82rem;
      color: var(--text-2);
      line-height: 1.75
    }

    .playbook-card ul {
      padding-left: 1.15rem
    }

    footer {
      text-align: center;
      font-size: .78rem;
      color: var(--text-3);
      padding: 1.5rem 1rem .5rem;
      line-height: 1.9
    }

    /* ---------- 弹窗 ---------- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.25rem
    }

    .modal-box {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      width: min(760px, 100%);
      max-height: 88vh;
      overflow-y: auto
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 18px 18px 0 0
    }

    .modal-title {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--sky);
      display: flex;
      align-items: center;
      gap: .45rem
    }

    .modal-close-btn {
      border: none;
      background: transparent;
      font-size: 1.5rem;
      color: var(--text-3);
      cursor: pointer;
      line-height: 1;
      padding: 0 .3rem;
      border-radius: 6px
    }

    .modal-close-btn:hover {
      color: var(--text);
      background: var(--surface-3)
    }

    .modal-body {
      padding: 1.35rem
    }

    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      color: var(--text-2)
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-strong);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .load-error {
      background: var(--rose-soft);
      border: 1px solid #fecdd3;
      color: #9f1239;
      padding: 1.25rem;
      border-radius: 12px;
      max-width: 620px;
      font-size: .85rem;
      line-height: 1.8
    }

    /* ---------- 导入 & 提示 ---------- */
    .btn-import {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #fff;
      box-shadow: 0 6px 16px -6px rgba(5, 150, 105, .5)
    }

    .btn-import:hover {
      background: #047857;
      border-color: #047857;
      color: #fff
    }

    .data-strip.dragover {
      border-color: var(--emerald);
      background: linear-gradient(90deg, #ecfdf5, #dcfce7);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, .15)
    }

    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: #fff;
      border: 1px solid #bae6fd;
      color: #0369a1;
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700
    }

    .source-tag.imported {
      background: #fff;
      border-color: #a7f3d0;
      color: #047857
    }

    #toast {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      align-items: flex-end
    }

    .toast-item {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      padding: .7rem 1rem;
      font-size: .83rem;
      font-weight: 600;
      color: var(--text);
      max-width: 420px;
      animation: slideIn .22s ease
    }

    .toast-item.ok {
      border-left-color: var(--emerald)
    }

    .toast-item.error {
      border-left-color: var(--rose)
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }


    /* ---------- Avatar Cell, Badges & Modal Zoom (2026 Enhanced) ---------- */
    .cell-avatar {
      text-align: center;
      vertical-align: middle;
      padding: 0.45rem 0.25rem !important;
      width: 58px;
    }

    .lead-avatar-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      cursor: pointer;
      border-radius: 50%;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lead-avatar-wrapper:hover {
      transform: scale(1.15);
      z-index: 10;
    }

    .lead-avatar-img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-3);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .lead-avatar-img.avatar-dog {
      border: 2.5px solid #10b981;
    }

    .lead-avatar-img.avatar-person {
      border: 2.5px solid #0284c7;
    }

    .lead-avatar-wrapper:hover .lead-avatar-img.avatar-dog {
      border-color: #059669;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.45);
    }

    .lead-avatar-wrapper:hover .lead-avatar-img.avatar-person {
      border-color: #0369a1;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.45);
    }

    .avatar-tag-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .avatar-tag-badge.badge-dog {
      background: #ecfdf5;
      border: 1.5px solid #10b981;
    }

    .avatar-tag-badge.badge-person {
      background: #f0f9ff;
      border: 1.5px solid #0284c7;
    }

    /* Avatar Modal Popup Styles */
    .avatar-modal-box {
      width: min(640px, 95vw) !important;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.25);
      animation: avatarModalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes avatarModalIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .avatar-popup-container {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    @media (max-width: 620px) {
      .avatar-popup-container {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    .avatar-popup-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      flex-shrink: 0;
    }

    .avatar-popup-img-wrap {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.22);
    }

    .avatar-popup-img-wrap.wrap-dog {
      border: 4px solid #10b981;
    }

    .avatar-popup-img-wrap.wrap-person {
      border: 4px solid #0284c7;
    }

    .avatar-popup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-popup-watermark {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      text-align: center;
      padding: 4px 6px;
      letter-spacing: 0.6px;
    }

    .modal-avatar-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid;
    }

    .modal-avatar-badge.dog {
      background: #ecfdf5;
      color: #047857;
      border-color: #a7f3d0;
    }

    .modal-avatar-badge.person {
      background: #f0f9ff;
      color: #0369a1;
      border-color: #bae6fd;
    }

    .avatar-popup-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      min-width: 0;
    }

    .avatar-popup-name {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
    }

    .avatar-popup-id-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface-2);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      width: fit-content;
    }

    .avatar-popup-fbid {
      font-family: var(--mono);
      font-size: 0.84rem;
      color: var(--sky);
      font-weight: 700;
    }

    .btn-copy-fbid {
      padding: 2px 7px;
      font-size: 0.75rem;
      border-radius: 4px;
    }

    .avatar-popup-detail-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      font-size: 0.82rem;
    }

    .avatar-detail-item {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      line-height: 1.55;
    }

    .avatar-detail-label {
      color: var(--text-2);
      font-weight: 600;
      flex-shrink: 0;
    }

    .avatar-detail-val {
      color: var(--text);
      font-weight: 500;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .avatar-popup-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.3rem;
      flex-wrap: wrap;
    }

    @media(max-width:900px) {
      body {
        padding: 1rem .75rem 2.5rem;
      }

      header {
        padding: 1.15rem;
      }

      h1 {
        font-size: 1.35rem;
      }

      .header-controls {
        align-items: stretch;
        width: 100%;
      }
    }

    /* =========================================================================
     * 🌟 STICKY SUBNAV MENU & PROMINENT HIGHLIGHTED SECTION CONTROLLER
     * ========================================================================= */
    .report-subnav {
      position: sticky;
      top: 10px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 10px 18px;
      margin: 1rem 0 1.5rem;
      box-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    [data-theme="dark"] .report-subnav {
      background: rgba(15, 23, 42, 0.95);
      border-color: #334155;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .subnav-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .subnav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      font-size: 0.83rem;
      font-weight: 750;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      user-select: none;
    }

    .subnav-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
      transform: translateY(-1.5px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .subnav-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4338ca;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }

    [data-theme="dark"] .subnav-btn {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }

    [data-theme="dark"] .subnav-btn.active {
      background: #6366f1;
      color: #ffffff;
    }

    .subnav-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subnav-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .subnav-tool-btn.btn-expand {
      background: #ecfdf5;
      color: #047857;
      border: 1.5px solid #a7f3d0;
    }

    .subnav-tool-btn.btn-expand:hover {
      background: #059669;
      color: #ffffff;
      border-color: #047857;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    .subnav-tool-btn.btn-collapse {
      background: #fffbeb;
      color: #b45309;
      border: 1.5px solid #fde68a;
    }

    .subnav-tool-btn.btn-collapse:hover {
      background: #d97706;
      color: #ffffff;
      border-color: #b45309;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }

    /* 💎 HIGHLIGHTED SECTION CARD ACCORDION */
    .collapsible-sec {
      margin-bottom: 1.35rem;
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .sec-collapse-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-left: 6px solid #4f46e5;
      border-radius: 14px;
      margin-bottom: 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
    }

    /* Distinct highlight border per section */
    #secWeatherWrap .sec-collapse-header { border-left-color: #0284c7; }
    #secScoringWrap .sec-collapse-header { border-left-color: #d97706; }
    #secKpisWrap .sec-collapse-header { border-left-color: #059669; }
    #secChartsWrap .sec-collapse-header { border-left-color: #7c3aed; }
    #secTableWrap .sec-collapse-header { border-left-color: #4f46e5; }
    #secPlaybookWrap .sec-collapse-header { border-left-color: #db2777; }

    [data-theme="dark"] .sec-collapse-header {
      background: #151e32;
      border-color: #283548;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .sec-collapse-header:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -4px rgba(15, 23, 42, 0.12);
      border-color: #94a3b8;
    }

    .sec-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sec-header-title {
      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -0.015em;
      color: #0f172a;

    /* ============================ 天气引擎 ============================ */
    function locKeyOf(lead) {
      return lead.zip ? String(lead.zip) : `${lead.city || ''}_${lead.state || ''}`;
    }

    function offlineWeather(lead) {
      const rules = S.meta.weatherRules;
      const st = (lead.state || '').trim().toUpperCase();
      let type = 'mild';
      if (rules.cold.states.includes(st)) type = 'cold';
      else if (rules.rain.states.includes(st)) type = 'rain';
      else if (rules.hot.states.includes(st)) type = 'hot';
      const fb = rules[type].fallback;
      return {
        tempF: fb.tempF, tempC: Math.round((fb.tempF - 32) * 5 / 9),
        main: fb.main, desc: fb.desc, icon: fb.icon,
        humidity: 55, wind: 6, conditionType: type, cityName: lead.city || lead.state || 'USA', isLive: false
      };
    }

    async function fetchWeather(lead) {
      const key = locKeyOf(lead);
      if (!key || key === '_') return null;
      if (S.weatherCache[key]) return S.weatherCache[key];

      const cfg = S.meta.config;
      let url = '';
      if (lead.zip) url = `${cfg.owmEndpoint}?zip=${lead.zip},US&units=${cfg.owmUnits}&appid=${cfg.owmApiKey}`;
      else if (lead.city && lead.state) url = `${cfg.owmEndpoint}?q=${encodeURIComponent(lead.city)},${lead.state},US&units=${cfg.owmUnits}&appid=${cfg.owmApiKey}`;
      if (!url) return null;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('owm failed');
        const d = await res.json();
        const tempF = Math.round(d.main.temp);
        const main = d.weather[0].main;
        let type = 'mild';
        const th = S.meta.weatherRules.thresholds;
        if (tempF < th.coldBelowF || main === 'Snow') type = 'cold';
        else if (['Rain', 'Drizzle', 'Thunderstorm'].includes(main)) type = 'rain';
        else if (tempF > th.hotAboveF) type = 'hot';
        S.weatherCache[key] = {
          tempF, tempC: Math.round((tempF - 32) * 5 / 9), main,
          desc: d.weather[0].description, icon: d.weather[0].icon,
          humidity: d.main.humidity, wind: d.wind.speed, conditionType: type,
          cityName: d.name || lead.city || lead.state, isLive: true
        };
      } catch (e) {
        S.weatherCache[key] = offlineWeather(lead);
      }
      return S.weatherCache[key];
    }

    function weatherOf(lead) {
      const key = locKeyOf(lead);
      return (key && key !== '_' && S.weatherCache[key]) || null;
    }

    function triggerOf(lead, w) {
      const cond = w ? w.conditionType : 'mild';
      const temp = w ? `${w.tempF}°F (${w.tempC}°C) · ` : '';
      return {
        icon: { cold: '❄️', rain: '🌧️', hot: '☀️', mild: '🌤️' }[cond],
        cls: `w-${cond}`,
        label: temp + t(cond),
        pitch: t('pitch' + cond.charAt(0).toUpperCase() + cond.slice(1))
      };
    }

      grid.innerHTML = hubs.map(h => {

          <span>${esc(name)}</span>
          <span class="radar-live" id="rl-${h.id}">LIVE</span>
        </div>

        <div class="radar-weather-display">
          <span class="radar-temp" id="temp-${h.id}">${h.defaultTemp}°F</span>
          <div>
            <div class="radar-w-desc" id="desc-${h.id}">${esc(h.defaultMain)}</div>
            <div class="radar-w-sub" id="sub-${h.id}">${Math.round((h.defaultTemp - 32) * 5 / 9)}°C</div>
          </div>
        </div>

          set(`sub-${h.id}`, `${w.tempC}°C · 💧${w.humidity}% · 💨${w.wind}mph`);
          const rl = $(`rl-${h.id}`);

    /* ============================ 表格 ============================ */
    function amzKindOf(l) {
      const c = l.amz_cat || '';
      if (c.includes('Selling pet toys + Artificial grass')) return 'both_target';
      if (c.includes('Selling artificial grass')) return 'grass_target';
      if (c.includes('Selling pet toys')) return 'toys_target';
      if (!l.amz_link || c === 'Amazon link not found') return 'no_amz';
      return 'amz_other';
    }

    function tierCls(tier) {
      return { 'Tier S': 's', 'Tier A': 'a', 'Tier B': 'b', 'Tier C': 'c', 'Tier D': 'd' }[tier] || 'c';
    }

    function isGenericOwner(owner, kennelName) {
      if (!owner) return true;
      const o = String(owner).trim();
      if (o === 'Đang cập nhật hồ sơ' || o === 'Chưa xác thực' || o === '—' || o === '待进一步核实' || o === 'Chưa có thông tin') return true;
      if (/chủ trại|quản lý chuồng trại|breeder owner|kennel manager|huấn luyện viên|head trainer|shelter intake|director|manager|待进一步核实|管舍人|负责人/i.test(o)) {
        return true;
      }
      if (kennelName && o.toLowerCase() === String(kennelName).trim().toLowerCase()) {
        return true;
      }
      return false;
    }

    function applyFilters() {
      const q = ($('searchInput').value || '').toLowerCase().trim();
      const amzVal = $('amzFilter').value;
      const tierVal = $('tierFilter').value;
      const catVal = $('catFilter').value;
      const ownerVal = $('ownerFilter') ? $('ownerFilter').value : '';
      const wVal = $('weatherFilter').value;
      const avVal = $('avatarFilter') ? $('avatarFilter').value : '';
      const rules = S.meta.weatherRules;

      S.filtered = S.leads.filter(l => {
        if (q) {
          const hay = [l.name, l.owner, l.phone, l.email, l.city, l.state, l.zip, l.cat, l.product_fit, l.stt, l.fb_id]
            .filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (tierVal && l.rank_tier !== tierVal) return false;
        if (catVal && l.cat_code !== catVal) return false;
        if (avVal && l.avatar_type !== avVal) return false;
        if (ownerVal) {
          const isGen = isGenericOwner(l.owner, l.name);
          if (ownerVal === 'generic' && !isGen) return false;
          if (ownerVal === 'named' && isGen) return false;
        }
        if (amzVal) {
          const k = amzKindOf(l);
          if (amzVal === 'has_amz' ? k === 'no_amz' : k !== amzVal) return false;
        }
        if (wVal) {
          const st = (l.state || '').trim().toUpperCase();
          if (wVal === 'cold') { if (!rules.cold.states.includes(st)) return false; }
          else if (wVal === 'rain') { if (!rules.rain.states.includes(st)) return false; }
          else if (wVal === 'hot') { if (!rules.hot.states.includes(st)) return false; }
          else if (wVal === 'mild') {
            if ([...rules.cold.states, ...rules.rain.states, ...rules.hot.states].includes(st)) return false;
          }
        }
        const snovVal = $('snovFilter') ? $('snovFilter').value : '';
        if (snovVal) {
          if (snovVal === 'exported' && !l.is_snov_exported) return false;
          if (snovVal === 'new' && l.is_snov_exported) return false;
        }
        return true;
      });

      const { key, dir } = S.sort;
      const sign = dir === 'asc' ? 1 : -1;
      S.filtered.sort((a, b) => {
        let x = a[key], y = b[key];
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * sign;
        x = String(x == null ? '' : x); y = String(y == null ? '' : y);
        return x.localeCompare(y, 'en') * sign;
      });
    }

    function renderTable() {
      applyFilters();
      const tbody = $('leadsTableBody');
      S.pageSize = ($('pageSizeSelect') && Number($('pageSizeSelect').value)) || S.meta?.config?.pageSize || 25;
      const totalPages = Math.max(1, Math.ceil(S.filtered.length / S.pageSize));
      if (S.page > totalPages) S.page = totalPages;
      const start = (S.page - 1) * S.pageSize;
      const pageData = S.filtered.slice(start, start + S.pageSize);

      $('currentPage').textContent = S.page;
      $('totalPages').textContent = totalPages;
      $('prevBtn').disabled = S.page <= 1;
      $('nextBtn').disabled = S.page >= totalPages;
      $('recordCount').innerHTML = fmt(t('resultCount'), {
        shown: num(pageData.length), total: num(S.filtered.length), page: S.page, pages: totalPages
      });

      if (!pageData.length) {
        tbody.innerHTML = `<tr><td colspan="12" class="empty-row">${esc(t('noMatch'))}</td></tr>`;
        return;
      }

      tbody.innerHTML = pageData.map(lead => {
        const cls = tierCls(lead.rank_tier);
        const kind = amzKindOf(lead);
        const badgeMap = {
          both_target: ['badge-amz-target', 'amzTargetBoth'],
          grass_target: ['badge-amz-grass', 'amzTargetGrass'],
          toys_target: ['badge-amz-toys', 'amzTargetToys'],
          amz_other: ['badge-amz-none', 'amzOther'],
          no_amz: ['badge-amz-none', 'amzNone']
        };
        const [bCls, bKey] = badgeMap[kind];

    function toggleSort(key) {
      if (S.sort.key === key) S.sort.dir = S.sort.dir === 'asc' ? 'desc' : 'asc';
      else S.sort = { key, dir: key === 'score' ? 'desc' : 'asc' };

    function applyI18nHeaderSortOnly() {
      const cols = [
        { label: t('thCode'), sort: 'stt' }, { label: t('thAvatar') || 'Avatar', sort: 'avatar_type' }, { label: t('thFbId'), sort: 'fb_id' },
        { label: t('thName'), sort: 'name' },
        { label: t('thLocation'), sort: 'city' }, { label: t('thWeather'), sort: null },
        { label: t('thCategory'), sort: 'cat' }, { label: t('thAmazon'), sort: null },
        { label: t('thProduct'), sort: null }, { label: t('thScore'), sort: 'score' },
        { label: t('thTier'), sort: 'rank_tier' }, { label: t('thAction'), sort: null },
        { label: isVi() ? 'Thao tác' : '操作', sort: null }
      ];
      $('tableHead').innerHTML = cols.map(c => {
        if (!c.sort) return `<th>${c.label}</th>`;
        const active = S.sort.key === c.sort;
        const ind = active ? (S.sort.dir === 'asc' ? '▲' : '▼') : '↕';
        return `<th class="sortable${active ? ' sorted' : ''}" onclick="toggleSort('${c.sort}')">${c.label}<span class="sort-ind">${ind}</span></th>`;
      }).join('');
    }
    function changePage(delta) {
      const totalPages = Math.max(1, Math.ceil(S.filtered.length / S.pageSize));
      const target = S.page + delta;
      if (target < 1 || target > totalPages) return;
      S.page = target;
      renderTable();
      document.querySelector('.table-responsive').scrollTop = 0;
      document.querySelector('.table-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function saveCrudLead(event) {
      event.preventDefault();
      const mode = $('crudMode').value;
      const origStt = $('crudOriginalStt').value;
      const stt = $('crudStt').value.trim();
      const name = $('crudName').value.trim();

      if (!stt || !name) {
        alert(isVi() ? 'Vui lòng nhập đầy đủ Mã STT và Tên khách hàng!' : '请完整填写序号/编号与客户名称！');
        return;
      }

      const owner = $('crudOwner').value.trim();
      const fb_id = $('crudFbId').value.trim();
      const url = $('crudUrl').value.trim();
      const phone = $('crudPhone').value.trim();
      const email = $('crudEmail').value.trim();
      const city = $('crudCity').value.trim();
      const state = $('crudState').value.trim().toUpperCase();
      const zip = $('crudZip').value.trim();
      const website = $('crudWebsite').value.trim();
      const amz_link = $('crudAmzLink').value.trim();
      const cat_code = $('crudCatCode').value;
      const catMap = {
        breeder: 'Dog Breeder / Commercial Kennel (B2B)',
        service: 'Pet Boarding / Training Academy (B2B)',
        rescue: 'Pet Rescue / Animal Shelter',
        supplies: 'Pet Supplies & Retailer / Grooming',
        owner: 'Pet Owner / Individual'
      };
      const cat = catMap[cat_code] || 'Dog Breeder / Commercial Kennel (B2B)';
      const rank_tier = $('crudRankTier').value;
      const score = Math.max(0, Math.min(100, Number($('crudScore').value) || 75));
      const avatar_url = $('crudAvatarUrl').value.trim();
      const product_fit = $('crudProductFit').value.trim();
      const sales_action = $('crudSalesAction').value.trim();

      if (mode === 'add') {
        const dup = S.leads.find(l => String(l.stt).toLowerCase() === stt.toLowerCase());
        if (dup) {
          alert(isVi() ? `Mã STT [${stt}] đã tồn tại trong danh sách!` : `编号 [${stt}] 已存在！`);
          return;
        }
        const newLead = {
          stt, name, owner, fb_id, url, phone, email,
          city, state, zip, country: 'United States',
          website, amz_link, cat, cat_code,
          rank_tier, score,
          product_fit, sales_action,
          avatar_url: avatar_url || '',
          avatar: avatar_url || '',
          avatar_type: 'dog',
          avatar_label: '🐶 Chó cưng (Dog)',
          ai_vision_result: 'Lead thủ công đã thẩm định'
        };
        S.leads.unshift(newLead);
        toast(isVi() ? `✅ Đã thêm mới khách hàng: ${name}` : `✅ 成功新增潜客：${name}`, 'ok');
      } else {
        const idx = S.leads.findIndex(l => String(l.stt) === String(origStt));
        if (idx === -1) return;
        const target = S.leads[idx];
        target.stt = stt;
        target.name = name;
        target.owner = owner;
        target.fb_id = fb_id;
        target.url = url;
        target.phone = phone;
        target.email = email;
        target.city = city;
        target.state = state;
        target.zip = zip;
        target.website = website;
        target.amz_link = amz_link;
        target.cat = cat;
        target.cat_code = cat_code;
        target.rank_tier = rank_tier;
        target.score = score;
        if (avatar_url) {
          target.avatar_url = avatar_url;
          target.avatar = avatar_url;
        }
        target.product_fit = product_fit;
        target.sales_action = sales_action;
        toast(isVi() ? `✅ Đã cập nhật thành công: ${name}` : `✅ 成功更新信息：${name}`, 'ok');
      }

    const LEAD_FIELDS = ['stt', 'name', 'owner', 'url', 'website', 'phone', 'email', 'address', 'city', 'state',

    function tierOfScore(s) { return s >= 85 ? 'Tier S' : s >= 70 ? 'Tier A' : s >= 50 ? 'Tier B' : s >= 30 ? 'Tier C' : 'Tier D'; }

    function codeOfCat(l) {
      if (l.cat_code) return l.cat_code;
      const c = String(l.cat || '').toLowerCase();
      if (c.includes('rescue') || c.includes('shelter')) return 'rescue';
      if (c.includes('training') || c.includes('grooming') || c.includes('care') || c.includes('k9')) return 'service';
      return 'breeder';
    }

    /**
     * 从 url 中提取 Facebook 主页 ID：
     *   profile.php?id=100068499867139  -> 100068499867139
     *   /466919830365897/               -> 466919830365897
     *   /pages/Name/153319254699055/    -> 153319254699055
     *   /Sierra-Springs-...-194814241052484/ -> 194814241052484
     *   /lkbernedoodles/                -> lkbernedoodles（自定义用户名）
     * 多个链接用 ; 分隔时取第一个 facebook 链接；非 FB 链接返回空。
     */
    function fbIdOf(lead) {
      if (lead.fb_id) return String(lead.fb_id);
      const raw = String(lead.url || '');
      const parts = raw.split(/[;,\s]+/).filter(Boolean);
      const fb = parts.find(u => /facebook\.com/i.test(u));
      if (!fb) return '';
      try {
        const u = new URL(/^https?:/i.test(fb) ? fb : 'https://' + fb);
        if (!/(^|\.)facebook\.com$/i.test(u.hostname)) return '';
        const id = u.searchParams.get('id');
        if (id && /^\d{5,}$/.test(id)) return id;
        const seg = u.pathname.split('/').filter(Boolean);
        if (!seg.length) return '';
        if (seg[0] === 'pages') {
          const nums = seg.filter(s => /^\d{5,}$/.test(s));
          if (nums.length) return nums[nums.length - 1];
        }
        const last = seg[seg.length - 1];
        if (/^\d{5,}$/.test(last)) return last;
        const m = last.match(/-(\d{8,})$/);
        if (m) return m[1];
        return last.replace(/\?.*$/, '');
      } catch (e) { return ''; }
    }

    /** 接受数组，或 { leads: [...] } 包装；补齐缺失字段并派生评级/分类编码 */
    function normalizeLeads(raw) {
      const arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.leads) ? raw.leads : null);
      if (!arr) throw new Error('shape');
      if (!arr.length) throw new Error('empty');
      if (!arr[0] || typeof arr[0] !== 'object' || Array.isArray(arr[0])) throw new Error('shape');
      return arr.map((l, i) => {
        const o = {};
        LEAD_FIELDS.forEach(k => { o[k] = (l && l[k] != null) ? l[k] : ''; });
        o.score = Number(o.score) || 0;
        if (!o.rank_tier) o.rank_tier = tierOfScore(o.score);
        if (!o.cat_code) o.cat_code = codeOfCat(o);
        if (!o.country) o.country = 'United States';
        if (!o.stt) o.stt = 'LEAD-' + String(i + 1).padStart(6, '0');
        if (!o.name) o.name = o.stt;
        o.is_prio = !!o.is_prio || o.rank_tier === 'Tier S';
        o.fb_id = fbIdOf(o);
        return o;
      });
    }

    /** 前端版统计引擎，与 tools/build.mjs 口径一致；导入后自动重算 */
    function computeAnalytics(leads) {
      const pct = (n) => leads.length ? +((n / leads.length) * 100).toFixed(1) : 0;
      const tally = (fn) => {
        const m = new Map();
        for (const r of leads) { const k = fn(r); if (k == null || k === '') continue; m.set(k, (m.get(k) || 0) + 1); }
        return [...m.entries()].sort((a, b) => b[1] - a[1]);
      };
      const order = ['Tier S', 'Tier A', 'Tier B', 'Tier C', 'Tier D'];
      const tiersRaw = tally((l) => l.rank_tier).sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
      const tiers = tiersRaw.map(([label, value]) => ({ label, value, percent: pct(value) }));

      const AMZ = {
        both_target: { zh: '玩具 + 草坪便盆（双目标）', vi: 'Cả đồ chơi + Cỏ/Potty (TARGET kép)' },
        grass_target: { zh: '草坪 / 便盆 TARGET', vi: 'Cỏ / Khay Potty (TARGET)' },
        toys_target: { zh: '玩具 TARGET', vi: 'Đồ chơi (TARGET)' },
        amz_other: { zh: '亚马逊其他品类', vi: 'Amazon khác' },
        no_amz: { zh: '暂无亚马逊店铺', vi: 'Chưa có Amazon' }
      };
      const amzRaw = tally(amzKindOf);
      const amazon = amzRaw.map(([key, value]) => ({ key, value, percent: pct(value), zh: AMZ[key].zh, vi: AMZ[key].vi }));
      const amazonIndex = Object.fromEntries(amzRaw);

      const CAT = {
        breeder: { zh: '商业繁育犬舍 (Breeder)', vi: 'Trại chó thương mại (Breeder)' },
        service: { zh: '训犬 / 美容 / 寄宿 (Pet Care)', vi: 'Huấn luyện & Boarding' },
        rescue: { zh: '动物救助站 (Rescue)', vi: 'Trạm cứu trợ / Shelter' }
      };
      const categories = tally((l) => l.cat_code).map(([key, value]) =>
        ({ key, value, percent: pct(value), zh: (CAT[key] || { zh: key }).zh, vi: (CAT[key] || { vi: key }).vi }));

      const scores = leads.map((l) => Number(l.score) || 0);
      const buckets = [
        { label: '85 - 100', min: 85, max: 100 }, { label: '70 - 84', min: 70, max: 84 },
        { label: '50 - 69', min: 50, max: 69 }, { label: '30 - 49', min: 30, max: 49 },
        { label: '< 30', min: -Infinity, max: 29 }
      ].map(b => ({ label: b.label, value: scores.filter(s => s >= b.min && s <= b.max).length }));

      const has = (k) => leads.filter((l) => typeof l[k] === 'string' && l[k].trim() !== '').length;
      const contactCoverage = [
        { key: 'phone', zh: '电话 Phone', vi: 'Điện thoại Phone', value: has('phone') },
        { key: 'email', zh: '邮箱 Email', vi: 'Email', value: has('email') },
        { key: 'website', zh: '官网 Website', vi: 'Website chính thức', value: has('website') },
        { key: 'url', zh: 'Facebook 主页', vi: 'Trang Facebook', value: has('url') },
        { key: 'zip', zh: '邮编 Zip', vi: 'Mã Zip', value: has('zip') }
      ].map(d => ({ ...d, percent: pct(d.value) }));

      const geoStates = tally((l) => String(l.state || '').trim().toUpperCase());
      const reachable = leads.filter((l) => l.phone || l.email).length;

      return {
        generatedAt: new Date().toISOString(),
        totalLeads: leads.length,
        score: {
          min: scores.length ? Math.min(...scores) : 0,
          max: scores.length ? Math.max(...scores) : 0,
          avg: scores.length ? +(scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0,
          buckets
        },
        tiers,
        tierIndex: Object.fromEntries(tiers.map(d => [d.label, d.value])),
        amazon,
        amazonIndex,
        amazonTotal: (amazonIndex.both_target || 0) + (amazonIndex.grass_target || 0) + (amazonIndex.toys_target || 0) + (amazonIndex.amz_other || 0),
        categories,
        contactCoverage,
        geo: { states: geoStates.slice(0, 12).map(([label, value]) => ({ label: label || '未标注', value })), distinctStates: geoStates.filter(([s]) => s).length },
        dataQuality: {
          reachableByPhoneOrEmail: reachable,
          reachablePercent: pct(reachable),
          missingState: leads.filter((l) => !String(l.state || '').trim()).length
        },
        priorityLeads: leads.filter((l) => l.is_prio).length
      };
    }

    function applyImported(leads, name) {
      // CHẾ ĐỘ CỘNG DỒN THÔNG MINH (ACCUMULATE / MERGE): Không xóa đè danh sách cũ!
      const currentLeads = S.leads || [];
      const leadMap = new Map();
      
      // Nạp danh sách hiện có vào Map
      currentLeads.forEach(l => {
        const key = (l.fb_id ? String(l.fb_id).trim() : '') || (l.url ? String(l.url).trim().toLowerCase() : '') || l.id;
        if (key) leadMap.set(key, l);
      });

      let added = 0;
      let updated = 0;

      leads.forEach(nl => {
        const key = (nl.fb_id ? String(nl.fb_id).trim() : '') || (nl.url ? String(nl.url).trim().toLowerCase() : '') || nl.id;
        if (key && leadMap.has(key)) {
          const old = leadMap.get(key);
          leadMap.set(key, { ...old, ...nl });
          updated++;
        } else if (key) {
          leadMap.set(key, nl);
          added++;
        }
      });

      const mergedLeads = Array.from(leadMap.values());
      S.leads = mergedLeads;
      S.filtered = [...mergedLeads];
      S.page = 1;
      S.sort = { key: 'score', dir: 'desc' };
      Object.keys(S.weatherCache).forEach(k => delete S.weatherCache[k]);
      S.an = computeAnalytics(mergedLeads);
      const now = new Date();
      S.source = { type: 'imported', name, count: mergedLeads.length, at: now, atLabel: fmtDateTime(now) };
      renderShell();
      applyI18n();
      renderRadarHubs();
      updateRadarStatus();
      renderCharts();
      renderTable();
      toast(isVi() ? `🎉 Đã cộng dồn thành công! +${added} đối tác mới, cập nhật ${updated} đối tác cũ. Tổng: ${mergedLeads.length}` : `✅ 累积导入成功！新增${added}条，更新${updated}条，总计${mergedLeads.length}条`, 'ok');
      
      // 🚀 TỰ ĐỘNG ĐỒNG BỘ LÊN SERVER ĐỂ MỌI NGƯỜI CÙNG THẤY (AUTO-SYNC TO SERVER)
      syncLeadsToServer(mergedLeads);
    }

    /* ============================ TỰ ĐỘNG ĐỒNG BỘ LÊN SERVER ============================ */
    let isSyncing = false;
    async function syncLeadsToServer(leads, isManual = false) {
      if (!Array.isArray(leads) || leads.length === 0) return;
      if (isSyncing) return;
      isSyncing = true;

      const currentHost = (window.location.protocol.startsWith('http')) ? `${window.location.protocol}//${window.location.host}` : '';
      
      // 1. Chuẩn bị payload CRM (Bảng thông tin cá nhân 30 trường)
      const crmPayload = JSON.stringify({ leads: leads });

      // 2. Chuẩn bị payload Timesheet (Bảng ma trận thời gian hoạt động người dùng)
      const dateSet = new Set();
      const tsMap = {};
      leads.forEach(l => {
        const rawFbId = (l.fb_id || '').toString().trim();
        const rawUrl = (l.url || '').toString().trim().toLowerCase().replace(/\/+$/, '');
        const key = rawFbId || rawUrl || l.id;
        if (!key) return;

        const actLedger = (l.activity_ledger && typeof l.activity_ledger === 'object') ? { ...l.activity_ledger } : {};
        const pubStr = l.publish_time || '';
        let dateKey = '2026-10-23';
        if (pubStr.includes('/')) {
          const dParts = pubStr.split(' ')[0].split('/');
          if (dParts.length === 3) dateKey = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
        } else if (pubStr.includes('-')) {
          const m = pubStr.match(/\d{4}-\d{2}-\d{2}/);
          if (m) dateKey = m[0];
        }
        if (Object.keys(actLedger).length === 0 || !actLedger[dateKey]) {
          actLedger[dateKey] = {
            posted: true,
            post_time: '12:00',
            post_type: 'Feed',
            full_str: pubStr || dateKey
          };
        }
        Object.keys(actLedger).forEach(dk => dateSet.add(dk));

        tsMap[key] = {
          fb_id: rawFbId,
          lead_id: l.lead_id || l.stt || key,
          name: l.name || '',
          owner: l.owner || '',
          phone: l.phone || '',
          email: l.email || '',
          website: l.website || '',
          amazon_url: l.amazon_url || '',
          amazon_category: l.amazon_category || l.amz_cat || '',
          has_amazon: Boolean(l.has_amazon || l.amazon_url),
          city: l.city || '',
          state: l.state || '',
          zip: l.zip || '',
          country: l.country || 'United States',
          dog_breeds: l.dog_breeds || [],
          business_type: l.business_type || l.cat || '',
          category: l.category || '',
          bio: l.bio || '',
          url: l.url || (rawFbId ? `https://www.facebook.com/profile.php?id=${rawFbId}` : ''),
          avatar: l.avatar_url || l.avatar || '',
          score: l.score || 75,
          rank_tier: l.rank_tier || 'Tier A',
          sales_action: l.sales_action || '',
          activity_ledger: actLedger,
          golden_hour_slot: l.golden_hour_slot || '16:00 - 18:00',
          active_streak_days: Object.keys(actLedger).length,
          latest_post_time: pubStr || 'Hôm nay',
          latest_post_date: dateKey
        };
      });

      const tsPayload = JSON.stringify({
        matrix: {
          tracked_dates: Array.from(dateSet).sort(),
          leads: tsMap
        }
      });

      // Danh sách endpoint đồng bộ 2 bảng lên Server
      const syncTargets = [
        { url: currentHost ? `${currentHost}/api.php?route=save-crm` : null, body: crmPayload, type: 'CRM' },
        { url: currentHost ? `${currentHost}/api.php?route=save-timesheet` : null, body: tsPayload, type: 'Timesheet' },
        { url: 'http://43.156.237.143:3007/api.php?route=save-crm', body: crmPayload, type: 'CRM' },
        { url: 'http://43.156.237.143:3007/api.php?route=save-timesheet', body: tsPayload, type: 'Timesheet' }
      ].filter(t => Boolean(t.url));

      let crmSuccess = false;
      let tsSuccess = false;

      for (const target of syncTargets) {
        try {
          const resp = await fetch(target.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: target.body
          });
          if (resp.ok) {
            if (target.type === 'CRM') crmSuccess = true;
            if (target.type === 'Timesheet') tsSuccess = true;
          }
        } catch (_) {}
      }

      isSyncing = false;
      const totalSync = leads.length;
      if (crmSuccess || tsSuccess) {
        const msgVi = `✅ [ĐỒNG BỘ THÀNH CÔNG] Đã lưu thành công cả Bảng Thông Tin Cá Nhân & Bảng Thời Gian Hoạt Động (${totalSync} khách hàng) lên Server 43.156.237.143!`;
        const msgZh = `✅ [同步成功] 已成功将潜客个人资料与考勤活动数据 (${totalSync} 条) 双向同步至服务器 43.156.237.143！`;
        toast(isVi() ? msgVi : msgZh, 'ok');
      } else {
        const errMsgVi = `❌ [ĐỒNG BỘ THẤT BẠI] Không thể kết nối tới Server 43.156.237.143! Vui lòng kiểm tra lại mạng hoặc máy chủ.`;
        const errMsgZh = `❌ [同步失败] 无法连接到服务器 43.156.237.143！请检查网络或服务器状态。`;
        toast(isVi() ? errMsgVi : errMsgZh, 'error');
      }
    }

    async function importMultipleFiles(files) {
      if (!files || files.length === 0) return;
      toast(isVi() ? `⏳ Đang đọc và hợp nhất ${files.length} tệp dữ liệu...` : `⏳ 正在读取并合并 ${files.length} 个数据文件...`, 'ok');

        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          let rawList = [];
          if (Array.isArray(parsed)) {
            rawList = parsed;
          } else if (parsed && Array.isArray(parsed.leads)) {
            rawList = parsed.leads;
          } else if (parsed && parsed.leads && typeof parsed.leads === 'object') {
            rawList = Object.values(parsed.leads);
          } else if (parsed && Array.isArray(parsed.data)) {
            rawList = parsed.data;
          }
          if (rawList.length > 0) {
            const normalized = normalizeLeads(rawList);
            allIncomingLeads.push(...normalized);
            fileNames.push(file.name);
          }
        } catch (err) {
          console.warn(`Lỗi đọc tệp ${file.name}:`, err);
        }
      }

      if (allIncomingLeads.length === 0) {
        toast(isVi() ? '❌ Không tìm thấy dữ liệu khách hàng hợp lệ trong các tệp đã chọn!' : '❌ 所选文件中未发现有效客户数据！', 'error');
        return;
      }

      applyImported(allIncomingLeads, fileNames.join(' + '));
    }

    function bindDropZone() {
      const zone = $('dataStrip');
      if (!zone) return;
      const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
      ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { stop(e); zone.classList.add('dragover'); }));
      zone.addEventListener('dragleave', e => { stop(e); zone.classList.remove('dragover'); });
      zone.addEventListener('drop', async e => {
        stop(e);
        zone.classList.remove('dragover');
        const files = e.dataTransfer && e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
        if (files.length > 0) await importMultipleFiles(files);
      });
    }

    let snovHistoryCache = null;

    async function loadSnovHistory() {
      if (snovHistoryCache) return snovHistoryCache;
      
      // 1. Thử lấy từ localStorage
      try {
        const local = localStorage.getItem('snov_export_history');
        if (local) {
          snovHistoryCache = JSON.parse(local);
        }
      } catch (_) {}

      // 2. Thử fetch từ Server
      try {
        const resp = await fetch('data/snov_export_history.json', { cache: 'no-cache' });
        if (resp.ok) {
          const serverHist = await resp.json();
          if (serverHist && serverHist.exported_emails) {
            if (!snovHistoryCache) {
              snovHistoryCache = serverHist;
            } else {
              Object.assign(snovHistoryCache.exported_emails, serverHist.exported_emails);
              Object.assign(snovHistoryCache.exported_fbids, serverHist.exported_fbids);
            }
          }
        }
      } catch (_) {}

      if (!snovHistoryCache) {
        snovHistoryCache = { exported_emails: {}, exported_fbids: {}, batches: [] };
      }
      return snovHistoryCache;
    }
